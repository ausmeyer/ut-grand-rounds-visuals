<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Slide 26 · The primary model favors weeks 47–48</title>
  <style>
    :root { --paper:#fbfaf6; --ink:#14242b; --muted:#647278; --teal:#0a6670; --line:#d5dad6; --red:#933a4b; }
    * { box-sizing:border-box; }
    html,body { width:100%; height:100%; margin:0; overflow:hidden; }
    body { background:var(--paper); color:var(--ink); font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; }
    .slide { position:absolute; width:1280px; height:720px; left:50%; top:50%; transform:translate(-50%,-50%) scale(var(--scale,1)); transform-origin:center; }
    h1 { position:absolute; left:50px; top:48px; width:1180px; margin:0; font-family:Montserrat,Inter,ui-sans-serif,system-ui,sans-serif; font-size:36px; line-height:1.22; font-weight:550; letter-spacing:-.8px; }
    .visual { position:absolute; left:20px; top:113px; width:1240px; height:587px; }
    .scope { position:absolute; top:9px; right:29px; font-size:14px; color:var(--muted); }
    svg { display:block; width:1208px; height:535px; margin:0 16px; overflow:visible; }
    svg text { fill:var(--ink); font-family:inherit; }
    .axis { font-size:14px; fill:var(--muted); }
    .grid { stroke:#dfe4df; stroke-width:1; }
    .teal { fill:var(--teal); }
    .controls { height:49px; padding:11px 29px 0; display:flex; align-items:center; gap:10px; }
    button { border:1px solid #b9c3c0; border-radius:8px; background:white; color:var(--ink); height:34px; font:inherit; font-size:14px; font-weight:650; cursor:pointer; padding:0 17px; white-space:nowrap; }
    button:hover { border-color:var(--teal); }
    button[aria-pressed=true] { color:var(--teal); border-color:var(--teal); background:#edf6f4; }
    button:focus-visible { outline:3px solid #82bcc1; outline-offset:3px; }
    #reset { padding:0 10px; font-size:19px; margin-left:auto; }
    #control-hint { color:var(--muted); font-size:13px; margin-left:9px; }
    .sr-only { position:absolute; width:1px; height:1px; overflow:hidden; clip-path:inset(50%); }
  </style>
</head>
<body>
  <main class="slide" aria-label="Slide 26. The primary model favors weeks 47–48">
    <h1>The primary model favors weeks 47–48</h1>
    <section class="visual" aria-label="National vaccination timing result">
      <span class="scope">National · All ages</span>
      <svg viewBox="0 0 1208 535" role="img" aria-labelledby="chart-title chart-desc">
        <title id="chart-title">Mean burden left avoidable because of vaccination timing</title>
        <desc id="chart-desc"></desc>
        <defs><clipPath id="curve-clip"><rect id="trace-window" x="76" y="92" width="1086" height="377"/></clipPath></defs>
        <text x="76" y="23" font-size="21" font-weight="650">Burden left avoidable because of timing</text>
        <text class="axis" x="76" y="46">Seasonal ILI visits per 10,000 outpatient encounters each week</text>
        <rect id="guidance-band" y="100" height="360" fill="#e9ebe5"/>
        <text id="guidance-label" y="87" text-anchor="middle" font-size="15" style="fill:var(--muted)">September–October guidance</text>
        <g id="window-band"><rect id="best-band" y="100" height="360" fill="#dceee9"/></g>
        <g id="y-axis"></g>
        <g id="x-axis"></g>
        <g id="result">
          <path id="mean-curve" fill="none" stroke="#0a6670" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" clip-path="url(#curve-clip)"/>
        </g>
        <g id="highlights">
          <g id="early-comparison">
            <path id="early-comparison-leader" fill="none" stroke="#87958f" stroke-width="1.2"/>
            <text id="early-comparison-week" y="284" text-anchor="end" font-size="16" style="fill:var(--muted)">Week 40</text>
            <text id="early-comparison-value" y="318" text-anchor="end" font-size="32" font-weight="650"></text>
            <circle id="early-comparison-point" r="4.8" fill="#933a4b" stroke="#fbfaf6" stroke-width="1.7" data-week="40"/>
          </g>
          <g id="comparison">
            <path id="comparison-leader" fill="none" stroke="#87958f" stroke-width="1.2"/>
            <text id="comparison-week" y="354" text-anchor="end" font-size="16" style="fill:var(--muted)">Week 44</text>
            <text id="comparison-value" y="388" text-anchor="end" font-size="32" font-weight="650"></text>
            <circle id="comparison-point" r="4.8" fill="#933a4b" stroke="#fbfaf6" stroke-width="1.7" data-week="44"/>
          </g>
          <path id="window-leader" fill="none" stroke="#70938e" stroke-width="1.3"/>
          <text x="602" y="162" font-size="23" font-weight="550">Late November–early December</text>
          <text class="teal" x="602" y="196" font-size="25" font-weight="650">Weeks 47–48</text>
          <text id="window-value" class="teal" x="602" y="243" font-size="40" font-weight="650"></text>
          <text x="695" y="241" font-size="17" style="fill:var(--muted)">at either date</text>
          <g id="window-points"></g>
        </g>
        <text class="axis" x="619" y="512" text-anchor="middle">Vaccination date · approximate calendar</text>
        <text class="axis" x="76" y="533">Lower is better</text>
        <g id="curve-key">
          <line x1="911" x2="941" y1="531" y2="531" stroke="#0a6670" stroke-width="3.6"/>
          <text class="axis" x="951" y="535">Mean of 5,000 scenarios</text>
        </g>
      </svg>
      <div class="controls">
        <button id="start" aria-pressed="true">1 · Start</button>
        <button id="curve" aria-pressed="false">2 · Show the result</button>
        <button id="window" aria-pressed="false">3 · Highlight the window</button>
        <span id="control-hint">Arrow keys to advance</span>
        <button id="reset" aria-label="Reset demonstration" title="Reset">↺</button>
      </div>
      <output id="status" class="sr-only" aria-live="polite"></output>
    </section>
  </main>
  <script>
    const DATA = /*__SLIDE_DATA__*/;
    const $ = id => document.getElementById(id);
    const NS = 'http://www.w3.org/2000/svg';
    const X = j => 76 + j / 28 * 1086;
    const Y = r => 460 - r / DATA.y_max * 360;
    const index = week => DATA.candidate_weeks.indexOf(week);
    const reducedMotion = matchMedia('(prefers-reduced-motion:reduce)').matches;
    let stage = 1, animation = 0;
    function element(tag,attrs,parent,text) {
      const el=document.createElementNS(NS,tag);
      for(const [key,value] of Object.entries(attrs)) el.setAttribute(key,value);
      if(text!==undefined) el.textContent=text;
      parent.appendChild(el); return el;
    }
    function visible(id,show) { $(id).style.display=show?'':'none'; }
    for(let value=0;value<=DATA.y_max;value+=500) {
      element('line',{x1:76,x2:1162,y1:Y(value),y2:Y(value),class:'grid'},$('y-axis'));
      element('text',{x:60,y:Y(value)+5,'text-anchor':'end',class:'axis'},$('y-axis'),value.toLocaleString('en-US'));
    }
    for(const [week,month] of [[36,'Sep'],[40,'Oct'],[44,'Nov'],[48,'Dec'],[1,'Jan'],[5,'Feb'],[9,'Mar']])
      element('text',{x:X(index(week)),y:486,'text-anchor':'middle',class:'axis'},$('x-axis'),month);
    $('guidance-band').setAttribute('x',X(0));
    $('guidance-band').setAttribute('width',X(8)-X(0));
    $('guidance-label').setAttribute('x',(X(0)+X(8))/2);
    const low=index(DATA.highlight_weeks[0]), high=index(DATA.highlight_weeks[1]);
    $('best-band').setAttribute('x',X(low-.5));
    $('best-band').setAttribute('width',X(high+.5)-X(low-.5));
    $('mean-curve').setAttribute('d',DATA.mean_visits.map((value,j)=>`${j?'L':'M'}${X(j).toFixed(3)},${Y(value).toFixed(3)}`).join(' '));
    for(const [week,id,leaderY] of [[40,'early-comparison',311],[44,'comparison',381]]) {
      const j=index(week), cx=X(j), cy=Y(DATA.mean_visits[j]);
      $(`${id}-point`).setAttribute('cx',cx); $(`${id}-point`).setAttribute('cy',cy);
      $(`${id}-week`).setAttribute('x',cx-17); $(`${id}-value`).setAttribute('x',cx-17);
      $(`${id}-value`).textContent=Math.round(DATA.mean_visits[j]);
      $(`${id}-leader`).setAttribute('d',`M${cx-7},${leaderY} L${cx},${leaderY} V${cy-8}`);
    }
    const mx=(X(low)+X(high))/2, my=Y(DATA.mean_visits[DATA.best_index]);
    $('window-leader').setAttribute('d',`M584,177 H${mx} V${my-10}`);
    $('window-value').textContent=`≈${Math.round(DATA.mean_visits[DATA.best_index])}`;
    for(const week of DATA.highlight_weeks) {
      const j=index(week);
      element('circle',{cx:X(j),cy:Y(DATA.mean_visits[j]),r:5.5,fill:'#933a4b',stroke:'#fbfaf6','stroke-width':1.8,'data-week':week},$('window-points'));
    }
    function setStage(value,play=true) {
      cancelAnimationFrame(animation); stage=value; document.body.dataset.state=value;
      history.replaceState(null,'',`#state=${value}`);
      ['start','curve','window'].forEach((id,i)=>$(id).setAttribute('aria-pressed',value===i+1));
      visible('result',value>=2); visible('curve-key',value>=2);
      visible('window-band',value===3); visible('highlights',value===3);
      $('trace-window').setAttribute('width',1086);
      if(value===2&&play&&!reducedMotion) {
        const start=performance.now(); $('trace-window').setAttribute('width',0);
        function frame(now) {
          const progress=Math.max(0,Math.min(1,(now-start)/2200));
          $('trace-window').setAttribute('width',1086*progress);
          if(progress<1) animation=requestAnimationFrame(frame);
        }
        animation=requestAnimationFrame(frame);
      }
      $('chart-desc').textContent=[
        '',
        'Calendar of candidate vaccination dates. A gray band approximates the September–October guidance window. The curve is revealed on the next advance.',
        'Mean regret across 5,000 original primary-model simulations for the US all-age population. Values are seasonal standardized ILI visits in a system with 10,000 outpatient encounters each week. Regret compares each date with the best date in the same scenario.',
        'Week 47 minimizes mean regret. Weeks 47 and 48 each leave about 55 avoidable ILI visits, compared with 498 at week 40 and 189 at week 44, over a season with 10,000 outpatient encounters each week. The highlighted dates are not an uncertainty interval.'
      ][value];
      $('status').textContent=$('chart-desc').textContent;
    }
    ['start','curve','window'].forEach((id,i)=>$(id).addEventListener('click',()=>setStage(i+1)));
    $('reset').addEventListener('click',()=>setStage(1,false));
    document.addEventListener('keydown',event=>{
      if(event.repeat||(event.target.tagName==='BUTTON'&&event.key===' ')) return;
      if(['ArrowRight','PageDown',' ','ArrowLeft','PageUp','Home'].includes(event.key)) {
        event.preventDefault(); setStage(event.key==='Home'?1:['ArrowLeft','PageUp'].includes(event.key)?Math.max(1,stage-1):Math.min(3,stage+1));
      }
    });
    function fit() { document.documentElement.style.setProperty('--scale',Math.min(innerWidth/1280,innerHeight/720)); }
    addEventListener('resize',fit); fit();
    const hash=new URLSearchParams(location.hash.slice(1));
    setStage(Math.max(1,Math.min(3,Number(hash.get('state'))||1)),false);
  </script>
</body>
</html>
