<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Slide 32 · Can the shape of the rise guide timing?</title>
  <style>
    :root { --paper:#fbfaf6; --ink:#14242b; --muted:#647278; --teal:#0a6670; --red:#933a4b; }
    * { box-sizing:border-box; }
    html,body { width:100%; height:100%; margin:0; overflow:hidden; }
    body { background:var(--paper); color:var(--ink); font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; }
    .slide { position:absolute; width:1280px; height:720px; left:50%; top:50%; transform:translate(-50%,-50%) scale(var(--scale,1)); transform-origin:center; }
    h1 { position:absolute; left:50px; top:48px; width:1180px; margin:0; font-family:Montserrat,Inter,ui-sans-serif,system-ui,sans-serif; font-size:36px; line-height:1.22; font-weight:550; letter-spacing:-.8px; }
    .visual { position:absolute; left:20px; top:113px; width:1240px; height:587px; }
    svg { display:block; width:1208px; height:535px; margin:0 16px; overflow:visible; }
    svg text { fill:var(--ink); font-family:inherit; }
    .axis { fill:var(--muted); font-size:14px; }
    .curve { fill:none; stroke-linejoin:round; stroke-linecap:round; }
    .grid { stroke:#dfe4df; stroke-width:1; }
    .controls { height:49px; padding:11px 29px 0; display:flex; align-items:center; gap:8px; }
    button,select { border:1px solid #b9c3c0; border-radius:8px; background:white; color:var(--ink); height:34px; font:inherit; font-size:14px; font-weight:650; cursor:pointer; padding:0 12px; white-space:nowrap; }
    button:hover,select:hover { border-color:var(--teal); }
    button[aria-pressed=true] { color:var(--teal); border-color:var(--teal); background:#edf6f4; }
    button:focus-visible,select:focus-visible { outline:3px solid #82bcc1; outline-offset:3px; }
    button:disabled { opacity:.35; cursor:default; }
    #reset { padding:0 10px; font-size:19px; margin-left:auto; }
    #control-hint { color:var(--muted); font-size:13px; margin-left:8px; }
    #draw-picker { position:absolute; right:70px; top:38px; display:flex; align-items:center; gap:7px; }
    #draw-picker[hidden] { display:none; }
    #draw-picker button { width:34px; padding:0; font-size:20px; }
    #draw-select { width:195px; }
    .sr-only { position:absolute; width:1px; height:1px; overflow:hidden; clip-path:inset(50%); }
  </style>
</head>
<body>
  <main class="slide" aria-label="Slide 32. Can the shape of the rise guide timing?">
    <h1>Can the shape of the rise guide timing?</h1>
    <section class="visual" aria-label="An exploratory comparison of optimal timing and epidemic slopes">
      <svg viewBox="0 0 1208 535" role="img" aria-labelledby="chart-title chart-desc">
        <title id="chart-title">Activity and its first derivative</title>
        <desc id="chart-desc"></desc>
        <text x="64" y="23" font-size="15" font-weight="650" style="fill:var(--teal)">NEXT STUDY</text>
        <text id="sample-count" x="1154" y="23" text-anchor="end" class="axis"></text>
        <g id="timing-legend">
          <circle cx="69" cy="56" r="5" fill="#933a4b"/>
          <text id="dose-legend" x="82" y="61" class="axis">Optimal vaccination</text>
          <circle cx="288" cy="56" r="5" fill="#fbfaf6" stroke="#0a6670" stroke-width="2"/>
          <text id="onset-legend" x="301" y="61" class="axis">Modeled protection onset</text>
          <g id="reference-legend">
            <line x1="538" x2="560" y1="56" y2="56" stroke="#647278" stroke-width="1.5" stroke-dasharray="4 4"/>
            <text x="568" y="61" class="axis">Fastest rise</text>
          </g>
        </g>
        <g id="chart"></g>
      </svg>
      <div id="draw-picker" hidden>
        <button id="previous-draw" aria-label="Previous draw">‹</button>
        <label for="draw-select" class="sr-only">Inspect one of the 50 paired draws</label>
        <select id="draw-select"></select>
        <button id="next-draw" aria-label="Next draw">›</button>
      </div>
      <div class="controls">
        <button id="start" aria-pressed="true">1 · Start</button>
        <button id="mean-timing" aria-pressed="false">2 · Mean timing</button>
        <button id="draws" aria-pressed="false">3 · 50 draws</button>
        <button id="individual" aria-pressed="false">4 · Each draw</button>
        <button id="seasons" aria-pressed="false">5 · By season</button>
        <span id="control-hint">Arrow keys to advance</span>
        <button id="reset" aria-label="Reset demonstration" title="Reset">↺</button>
      </div>
      <output id="status" class="sr-only" aria-live="polite"></output>
    </section>
  </main>
  <script>
    const DATA = /*__SLIDE_DATA__*/;
    const $=id=>document.getElementById(id), NS='http://www.w3.org/2000/svg';
    const reducedMotion=matchMedia('(prefers-reduced-motion:reduce)').matches;
    const buttons=['start','mean-timing','draws','individual','seasons'];
    let stage=1, selected=0, animation=0;
    function element(tag,attrs,parent,text) {
      const el=document.createElementNS(NS,tag);
      for(const [key,value] of Object.entries(attrs)) el.setAttribute(key,value);
      if(text!==undefined) el.textContent=text;
      parent.appendChild(el); return el;
    }
    function at(points,time) {
      const i=Math.min(points.length-2,Math.max(0,points.findIndex(p=>p[0]>=time)-1));
      const a=points[i], b=points[i+1]; return a[1]+(b[1]-a[1])*(time-a[0])/(b[0]-a[0]);
    }
    function path(points,X,Y,shift=0) { return points.map(([t,v],i)=>`${i?'L':'M'}${X(t+shift).toFixed(3)},${Y(v).toFixed(3)}`).join(' '); }
    function curveView() {
      const mean=stage<=2, single=stage===4, row=DATA.scenarios[selected];
      const xMax=single?row.activity.at(-1)[0]:DATA.bounds.aligned_x[1];
      const yMax=mean?DATA.bounds.mean_activity_max:single?Math.ceil(Math.max(...row.activity.map(p=>p[1]))):DATA.bounds.activity_max;
      const dMax=mean?DATA.bounds.mean_slope_max:single?Math.ceil(Math.max(...row.slope.map(p=>Math.abs(p[1])))*10)/10:DATA.bounds.slope_max;
      const X=t=>64+t/xMax*1090, Y=v=>279-v/yMax*177, D=v=>414-v/dMax*73;
      for(const value of [0,yMax/2,yMax]) {
        element('line',{x1:64,x2:1154,y1:Y(value),y2:Y(value),class:'grid'},$('chart'));
        element('text',{x:51,y:Y(value)+5,'text-anchor':'end',class:'axis'},$('chart'),value);
      }
      for(const value of [-dMax,0,dMax]) {
        element('line',{x1:64,x2:1154,y1:D(value),y2:D(value),class:'grid','stroke-dasharray':value===0?'':'3 5'},$('chart'));
        element('text',{x:51,y:D(value)+5,'text-anchor':'end',class:'axis'},$('chart'),value.toFixed(1));
      }
      element('text',{x:64,y:91,'font-size':16,'font-weight':600},$('chart'),'ILI (%)');
      element('text',{x:64,y:326,'font-size':16,'font-weight':600},$('chart'),'Weekly change (percentage points)');
      const ticks=single?[[0,'Sep'],[9,'Nov'],[row.max_week-35,'Jan'],[row.max_week-27,'Mar'],[row.max_week-18,'May']]:[0,8,16,24,32,40].map(t=>[t,t]);
      ticks.forEach(([t,label])=>element('text',{x:X(t),y:511,'text-anchor':'middle',class:'axis'},$('chart'),label));
      element('text',{x:609,y:534,'text-anchor':'middle',class:'axis'},$('chart'),single?'Calendar date':'Aligned time (weeks)');
      const marks=[];
      function draw(data,shift,color,width,opacity) {
        const g=element('g',{'data-draw':data.draw??'mean',opacity},$('chart'));
        for(const [panel,scale] of [['activity',Y],['slope',D]]) element('path',{d:path(data[panel],X,scale,shift),class:'curve',stroke:color,'stroke-width':width,'data-panel':panel},g);
        const timing=element('g',{'data-layer':'timing'},g);
        for(const [kind,color] of [['dose','#933a4b'],['onset','#0a6670']]) {
          const t=data[kind], x=X(t+shift);
          if(mean||single) element('line',{x1:x,x2:x,y1:102,y2:487,stroke:color,'stroke-width':1,opacity:.28},timing);
          for(const [panel,scale] of [['activity',Y],['slope',D]]) {
            const v=at(data[panel],t);
            const dot=element('circle',{cx:x,cy:scale(v),r:mean||single?6:3.1,fill:kind==='dose'?color:'#fbfaf6',stroke:kind==='dose'?'#fbfaf6':color,'stroke-width':kind==='dose'?1:1.7,'data-kind':kind,'data-panel':panel,'data-time':t,'data-aligned-time':t+shift,'data-value':v},timing);
            element('title',{},dot,`${kind==='dose'?'Optimal vaccination':'Modeled protection onset'}${data.draw?`, draw ${data.draw}`:', median aligned date'}`);
          }
        }
        if(stage===1) timing.style.opacity=0;
        marks.push(timing); return g;
      }
      const groups=[];
      if(mean) groups.push(draw(DATA.mean,0,'#425f66',2.7,1));
      else if(single) {
        element('line',{x1:X(row.fastest),x2:X(row.fastest),y1:102,y2:487,stroke:'#647278','stroke-width':1.5,'stroke-dasharray':'4 4','data-fastest':row.fastest},$('chart'));
        groups.push(draw(row,0,'#425f66',2.7,1));
      } else DATA.scenarios.forEach(row=>groups.push(draw(row,row.shift,'#a4b0b0',1.1,.62)));
      return {groups,marks};
    }
    function seasonView() {
      const X=t=>260+(t+12)/16*840;
      element('text',{x:64,y:99,'font-size':21,'font-weight':600},$('chart'),'Timing relative to each draw’s fastest rise');
      element('text',{x:1154,y:99,'text-anchor':'end',class:'axis'},$('chart'),'Median · middle 50%');
      for(const t of [-12,-8,-4,0,4]) {
        element('line',{x1:X(t),x2:X(t),y1:118,y2:466,stroke:t===0?'#647278':'#dfe4df','stroke-width':t===0?1.5:1,'stroke-dasharray':t===0?'4 4':''},$('chart'));
        element('text',{x:X(t),y:494,'text-anchor':'middle',class:'axis'},$('chart'),t>0?`+${t}`:t);
      }
      DATA.seasons.forEach((row,i)=>{
        const y=132+i*46, g=element('g',{'data-season':row.season},$('chart'));
        element('text',{x:64,y:y+5,'font-size':18},g,row.season.replace('/','–'));
        for(const [kind,dy,color] of [['dose',-6,'#933a4b'],['onset',6,'#0a6670']]) {
          const q=row[kind], attrs={'data-kind':kind,'data-q1':q.q1,'data-q3':q.q3,'data-median':q.median};
          element('line',{x1:X(q.q1),x2:X(q.q3),y1:y+dy,y2:y+dy,stroke:color,'stroke-width':3,'stroke-linecap':'round',opacity:.65,...attrs},g);
          element('circle',{cx:X(q.median),cy:y+dy,r:5,fill:kind==='dose'?color:'#fbfaf6',stroke:color,'stroke-width':2,...attrs},g);
        }
      });
      element('text',{x:680,y:528,'text-anchor':'middle',class:'axis'},$('chart'),'Weeks before / after the fastest rise');
    }
    function updateDescription() {
      const row=DATA.scenarios[selected];
      const scope='Existing national pre-pandemic ILI and VE pairs from eight historical seasons. Raw ILI percent, with no division by or subtraction of an estimated background. Weekly change is the centered difference, (ILI one week later minus ILI one week earlier) divided by two. No additional smoothing is applied. Vaccination dates maximize each pair’s saved utility; modeled protection starts after that pair’s saved 1–3-week response delay. These are retrospective smoothed latent curves, not an evaluated real-time rule.';
      const detail=stage<=2?`The aligned mean of the first 50 pairs. Horizontal shifts are reused from slide 30’s AUC-overlap alignment. Marks in state 2 are the separate median aligned vaccination and onset dates, placed on the mean, not a single representative pair. Median onset is at aligned week ${DATA.mean.onset}, and the mean’s fastest weekly rise is at ${DATA.mean.fastest}. Start does not animate.`:
        stage===3?'All first 50 paired draws, in saved order, with each pair’s own vaccination and onset dates in both panels. Curves and markers appear together over eight seconds.':
        stage===4?`Individual draw ${row.draw}, ${row.season}. Optimal vaccination week ${row.dose_week}; modeled response delay ${row.immune_lag_weeks} weeks. Vaccination is ${Math.abs(row.dose_offset)} weeks ${row.dose_offset<=0?'before':'after'} this curve’s fastest rise; protection onset is ${Math.abs(row.onset_offset)} weeks ${row.onset_offset<=0?'before':'after'} it. The select menu and previous/next draw buttons inspect all 50 pairs. Vertical axes rescale to each draw, retaining percent and percentage-point units.`:
        'All 5,000 saved pairs, grouped by their eight historical seasons. Dots show medians and lines show the middle 50 percent of timing offsets from each individual curve’s own maximum positive weekly rise. These intervals describe conditional draws, not uncertainty across 5,000 independent seasons. Nearness in the mean is not consistently reproduced within every season.';
      const reference='Fastest rise means the largest positive centered weekly change from week 36 through week 21, taking the earliest exact tie. It can be a later upswing in a multi-wave season; it is not necessarily the first transition from accelerating to approximately linear growth. Future weeks are used to describe slope and find this reference; no prospective detection threshold or clinical recommendation is being established.';
      $('chart-title').textContent=stage===5?'Timing by historical season':stage===4?`Draw ${row.draw}: ${row.season}`:'Activity and its first derivative';
      $('chart-desc').textContent=`${detail} ${scope} ${reference}`; $('status').textContent=detail;
    }
    function render() {
      $('chart').replaceChildren();
      $('timing-legend').style.visibility=stage===1?'hidden':'visible';
      $('reference-legend').style.display=stage===4?'':'none';
      $('dose-legend').textContent=stage<=2?'Median vaccination':'Optimal vaccination';
      $('onset-legend').textContent=stage<=2?'Median protection onset':'Modeled protection onset';
      $('draw-picker').hidden=stage!==4;
      $('previous-draw').disabled=selected===0; $('next-draw').disabled=selected===DATA.scenarios.length-1;
      $('draw-select').value=selected;
      $('sample-count').textContent=stage<=2?'Aligned mean · 50 paired draws':stage===3?'50 paired draws · 8 pre-pandemic seasons':stage===4?'Individual scenarios · calendar time':'5,000 paired draws · 8 historical seasons';
      const layers=stage===5?(seasonView(),null):curveView();
      updateDescription(); return layers;
    }
    function animate(duration,tick) {
      const start=performance.now();
      function frame(now) {
        const p=Math.max(0,Math.min(1,(now-start)/duration)); tick(p);
        if(p<1) animation=requestAnimationFrame(frame);
      }
      animation=requestAnimationFrame(frame);
    }
    function setStage(value,play=true) {
      const previous=stage;
      cancelAnimationFrame(animation); stage=Math.max(1,Math.min(buttons.length,Math.floor(value)));
      $('chart').style.opacity=1;
      document.body.dataset.state=stage; history.replaceState(null,'',`#state=${stage}`);
      buttons.forEach((id,i)=>$(id).setAttribute('aria-pressed',stage===i+1));
      const layers=render();
      if(play&&previous<stage&&!reducedMotion) {
        if(stage===2) {
          layers.marks.forEach(g=>g.style.opacity=0);
          animate(850,p=>layers.marks.forEach(g=>g.style.opacity=p*p*(3-2*p)));
        } else if(stage===3) {
          layers.groups.forEach(g=>g.style.opacity=0);
          animate(8000,p=>layers.groups.forEach((g,i)=>g.style.opacity=.62*Math.max(0,Math.min(1,p*50-i))));
        } else {
          $('chart').style.opacity=0;
          animate(550,p=>$('chart').style.opacity=p*p*(3-2*p));
        }
      } else $('chart').style.opacity=1;
    }
    DATA.scenarios.forEach((row,i)=>{
      const option=document.createElement('option'); option.value=i;
      option.textContent=`${String(i+1).padStart(2,'0')} · ${row.season.replace('/','–')}`; $('draw-select').appendChild(option);
    });
    function selectDraw(index) { cancelAnimationFrame(animation); selected=index; $('chart').style.opacity=1; render(); }
    $('draw-select').addEventListener('change',event=>selectDraw(Number(event.target.value)));
    $('previous-draw').addEventListener('click',()=>selectDraw(Math.max(0,selected-1)));
    $('next-draw').addEventListener('click',()=>selectDraw(Math.min(DATA.scenarios.length-1,selected+1)));
    buttons.forEach((id,i)=>$(id).addEventListener('click',()=>setStage(i+1)));
    $('reset').addEventListener('click',()=>{selected=0;setStage(1,false);});
    document.addEventListener('keydown',event=>{
      if(event.repeat||event.target.tagName==='SELECT'||(event.target.tagName==='BUTTON'&&event.key===' ')) return;
      if(['ArrowRight','PageDown',' ','ArrowLeft','PageUp','Home'].includes(event.key)) {
        event.preventDefault();
        const next=event.key==='Home'?1:['ArrowLeft','PageUp'].includes(event.key)?Math.max(1,stage-1):Math.min(buttons.length,stage+1);
        if(next!==stage) setStage(next);
      }
    });
    function fit() { document.documentElement.style.setProperty('--scale',Math.min(innerWidth/1280,innerHeight/720)); }
    addEventListener('resize',fit); fit();
    const hash=new URLSearchParams(location.hash.slice(1));
    setStage(Math.max(1,Math.min(buttons.length,Math.floor(Number(hash.get('state'))||1))),false);
  </script>
</body>
</html>
