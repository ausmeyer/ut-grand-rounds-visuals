<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Borrowing history from outpatient surveillance</title>
  <style>
    :root { --ink: #14242b; --muted: #647278; --teal: #0a6670; --paper: #fbfaf6; --line: #d5dad6; }
    * { box-sizing: border-box; }
    html, body { width: 1240px; height: 540px; margin: 0; overflow: hidden; }
    body { background: var(--paper); color: var(--ink); font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-variant-numeric: tabular-nums; }
    .app { width: 1240px; height: 540px; display: grid; grid-template-rows: 38px 1fr; gap: 8px; padding: 10px 16px 8px; }
    .topbar, .controls { display: flex; align-items: center; }
    .topbar { justify-content: space-between; gap: 16px; }
    .subtitle { color: #42535a; font-size: 16px; font-weight: 670; }
    .controls { gap: 7px; }
    .controls label { color: var(--muted); font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .07em; margin-right: 3px; }
    button, select { height: 32px; border: 1px solid #b9c3c0; border-radius: 8px; background: white; color: var(--ink); font: inherit; font-weight: 740; }
    select { width: 257px; padding: 0 32px 0 10px; font-size: 13px; }
    button { width: 34px; padding: 0; font-size: 17px; cursor: pointer; }
    button:hover { border-color: var(--teal); color: var(--teal); }
    button:disabled { opacity: .35; cursor: default; }
    :focus-visible { outline: 3px solid #82bcc1; outline-offset: 2px; }
    .frame { padding: 17px 24px; border: 1px solid var(--line); border-radius: 14px; background: white; box-shadow: 0 8px 24px rgb(28 49 50 / 7%); }
    #chart { display: block; width: 1158px; height: 438px; }
    svg { font-size: 18px; }
    svg text { fill: var(--ink); }
    .tick { fill: var(--muted); font-size: 16px; }
    .reconstructed-label { fill: var(--teal); font-size: 20px; font-weight: 670; }
    .observed-label { fill: #58666c; font-size: 20px; font-weight: 670; }
    .takeaway { font-size: 23px; font-weight: 700; }
    .citation { fill: var(--muted); font-size: 14px; }
    a:hover .citation { fill: var(--teal); text-decoration: underline; }
    .reveal { opacity: 0; visibility: hidden; }
    body[data-state="2"] .reveal, body[data-state="3"] .reveal, body[data-state="4"] .reveal { opacity: 1; visibility: visible; }
    #full-history { display: none; }
    body[data-state="4"] #full-history { display: inline; }
    body[data-state="4"] #initial-history { display: none; }
    #reconstructed-shift { transform: translateX(0); }
    body[data-state="3"] #reconstructed-shift, body[data-state="4"] #reconstructed-shift { transform: translateX(var(--shift-x)); }
    #observed-early { opacity: 1; visibility: visible; }
    body[data-state="3"] #observed-early, body[data-state="4"] #observed-early { opacity: 0; visibility: hidden; }
    #stitch-join { opacity: 0; visibility: hidden; }
    body[data-state="3"] #stitch-join, body[data-state="4"] #stitch-join { opacity: 1; visibility: visible; }
    body[data-ready] .reveal { transition: opacity 400ms ease, visibility 400ms; }
    body[data-ready] #observed-early { transition: opacity 300ms ease, visibility 300ms; }
    body[data-ready] #reconstructed-shift { transition: transform 1400ms cubic-bezier(.22,.61,.36,1); }
    body[data-ready][data-state="3"] #reconstructed-shift { transition-delay: 350ms; }
    body[data-ready][data-state="3"] #stitch-join { transition: opacity 150ms 1750ms, visibility 0s 1750ms; }
    @media (prefers-reduced-motion: reduce) {
      body[data-ready][data-state] .reveal, body[data-ready][data-state] #observed-early,
      body[data-ready][data-state] #reconstructed-shift, body[data-ready][data-state] #stitch-join { transition: none; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="subtitle">Texas · weekly influenza hospital admissions</div>
      <div class="controls"><label for="state-select">View</label><button id="back-button" aria-label="Previous view">←</button><select id="state-select" aria-label="Hospitalization history view"><option value="1">1 · Observed history</option><option value="2">2 · Add reconstructed history</option><option value="3">3 · Stitch the training history</option><option value="4">4 · Full history through 2026</option></select><button id="next-button" aria-label="Next view">→</button></div>
    </header>
    <section class="frame">
      <svg id="chart" viewBox="0 0 1158 438" role="img" aria-labelledby="chart-title chart-desc">
        <title id="chart-title">Borrowing history from outpatient surveillance in Texas</title>
        <desc id="chart-desc"></desc>
        <g id="initial-history">
          <g id="axes"></g>
          <g id="reconstructed" class="reveal" aria-hidden="true"><g id="reconstructed-shift"></g></g>
          <g id="observed"></g>
          <g id="stitch-join" aria-hidden="true"></g>
        </g>
        <g id="full-history" aria-hidden="true"></g>
        <g id="labels">
          <g class="reveal" aria-hidden="true">
            <line x1="156" x2="194" y1="23" y2="23" stroke="#0a6670" stroke-width="2.7" stroke-dasharray="5 3"/>
            <text x="205" y="30" class="reconstructed-label">Reconstructed from ILINet</text>
          </g>
          <line x1="910" x2="948" y1="23" y2="23" stroke="#58666c" stroke-width="2.7"/>
          <text x="959" y="30" class="observed-label">Observed</text>
          <text x="84" y="405" class="takeaway reveal" aria-hidden="true">A longer training history provides more context for the model to forecast.</text>
          <a href="https://doi.org/10.1016/j.epidem.2025.100816" target="_blank" rel="noopener noreferrer" aria-label="Meyer and colleagues, Epidemics 2025">
            <text x="1130" y="435" text-anchor="end" class="citation">Meyer et al. · Epidemics · 2025</text>
          </a>
        </g>
      </svg>
    </section>
  </main>
  <script>
    "use strict";
    const data = /*__SLIDE_DATA__*/;
    const select = document.getElementById("state-select"), back = document.getElementById("back-button"), next = document.getElementById("next-button");
    const start = Date.parse(`${data.start}T00:00:00Z`), end = Date.parse(`${data.end}T00:00:00Z`);
    const x = stamp => 84 + (Date.parse(`${stamp}T00:00:00Z`) - start) / (end - start) * 1046;
    const y = value => 338 - value / data.axis_max * 275;
    function add(parent, tag, attributes, content) {
      const element = document.createElementNS("http://www.w3.org/2000/svg", tag);
      for (const [key, value] of Object.entries(attributes)) element.setAttribute(key, value);
      if (content !== undefined) element.textContent = content;
      parent.appendChild(element);
      return element;
    }
    function drawAxes(axes, xScale, yScale, maximum, step, ticks) {
      for (let value = 0; value <= maximum; value += step) {
        add(axes, "line", {x1: 84, x2: 1130, y1: yScale(value), y2: yScale(value), stroke: value === 0 ? "#aab7b7" : "#e8edeb"});
        add(axes, "text", {x: 72, y: yScale(value) + 5, class: "tick", "text-anchor": "end"}, value.toLocaleString("en-US"));
      }
      add(axes, "line", {x1: 84, x2: 84, y1: 63, y2: 338, stroke: "#aab7b7"});
      add(axes, "text", {x: 19, y: 200, transform: "rotate(-90 19 200)", "text-anchor": "middle", fill: "#647278"}, "Hospital admissions");
      for (const [stamp, label] of ticks) {
        add(axes, "line", {x1: xScale(stamp), x2: xScale(stamp), y1: 338, y2: 346, stroke: "#aab7b7"});
        add(axes, "text", {x: xScale(stamp), y: 369, class: "tick", "text-anchor": stamp === ticks.at(-1)[0] ? "end" : "middle"}, label);
      }
    }
    const originalTicks = [[data.start, "2009"], ["2012-01-01", "2012"], ["2015-01-01", "2015"], ["2018-01-01", "2018"], ["2020-01-01", "2020"], [data.end, "Oct 2022"]];
    drawAxes(document.getElementById("axes"), x, y, data.axis_max, data.tick_step, originalTicks);
    const shiftPx = data.training_shift_days * 86400000 / (end - start) * 1046;
    document.documentElement.style.setProperty("--shift-x", `${shiftPx}px`);
    const retained = data.observed.filter(point => point.date >= data.retained_observed_start);
    const excluded = data.observed.filter(point => point.date < data.retained_observed_start);
    const observed = document.getElementById("observed");
    const early = add(observed, "g", {id: "observed-early"});
    const kept = add(observed, "g", {id: "observed-retained"});
    function pathData(points, xScale, yScale) {
      return points.map((point, i) => `${i ? "L" : "M"}${xScale(point.date).toFixed(2)},${yScale(point.value).toFixed(2)}`).join(" ");
    }
    function draw(parent, points, kind, xScale = x, yScale = y) {
      return add(parent, "path", {d: pathData(points, xScale, yScale), fill: "none", stroke: kind === "observed" ? "#58666c" : "#0a6670", "stroke-width": 2.7, "stroke-linejoin": "round", "stroke-linecap": "round", ...(kind === "reconstructed" ? {"stroke-dasharray": "5 3"} : {})});
    }
    draw(document.getElementById("reconstructed-shift"), data.reconstructed, "reconstructed");
    draw(early, [...excluded, retained[0]], "observed");
    draw(kept, retained, "observed");
    const last = data.reconstructed.at(-1), first = retained[0];
    add(document.getElementById("stitch-join"), "line", {x1: x(last.date) + shiftPx, y1: y(last.value), x2: x(first.date), y2: y(first.value), stroke: "#0a6670", "stroke-width": 2.7, "stroke-dasharray": "5 3"});
    const full = document.getElementById("full-history");
    const fullEnd = Date.parse(`${data.full_end}T00:00:00Z`);
    const fullX = stamp => 84 + (Date.parse(`${stamp}T00:00:00Z`) - start) / (fullEnd - start) * 1046;
    const fullY = value => 338 - value / data.full_axis_max * 275;
    const transitionAxes = add(full, "g", {id: "transition-axes", "aria-hidden": "true"});
    const fullAxes = add(full, "g", {id: "full-axes"});
    drawAxes(fullAxes, fullX, fullY, data.full_axis_max, data.full_tick_step, [[data.start, "2009"], ["2012-01-01", "2012"], ["2015-01-01", "2015"], ["2018-01-01", "2018"], ["2021-01-01", "2021"], ["2024-01-01", "2024"], [data.full_end, "Jul 2026"]]);
    const shifted = data.reconstructed.map(point => ({date: new Date(Date.parse(`${point.date}T00:00:00Z`) + data.training_shift_days * 86400000).toISOString().slice(0, 10), value: point.value}));
    const fullReconstructed = draw(add(full, "g", {id: "full-reconstructed"}), [...shifted, first], "reconstructed", fullX, fullY);
    const fullObserved = draw(add(full, "g", {id: "full-observed"}), retained, "observed", fullX, fullY);
    const extension = add(full, "g", {id: "full-extension"});
    draw(extension, [retained.at(-1), ...data.extended], "observed", fullX, fullY);
    function fullFrame(progress, reveal) {
      const animatedX = stamp => x(stamp) + (fullX(stamp) - x(stamp)) * progress;
      const animatedY = value => y(value) + (fullY(value) - y(value)) * progress;
      fullReconstructed.setAttribute("d", pathData([...shifted, first], animatedX, animatedY));
      fullObserved.setAttribute("d", pathData(retained, animatedX, animatedY));
      transitionAxes.replaceChildren();
      if (reveal < 1) drawAxes(transitionAxes, animatedX, animatedY, data.axis_max, data.tick_step, originalTicks);
      for (const [element, opacity] of [[transitionAxes, 1 - reveal], [fullAxes, reveal], [extension, reveal]]) {
        element.style.opacity = String(opacity);
        element.style.visibility = opacity === 0 ? "hidden" : "visible";
      }
    }
    let fullAnimation = 0;
    function animateFullHistory() {
      if (matchMedia("(prefers-reduced-motion: reduce)").matches) { fullFrame(1, 1); return; }
      const began = performance.now();
      fullFrame(0, 0);
      function frame(now) {
        const elapsed = now - began;
        const t = Math.min(1, elapsed / 1250);
        const reveal = Math.max(0, Math.min(1, (elapsed - 1250) / 650));
        fullFrame(t * t * (3 - 2 * t), reveal);
        if (reveal < 1) fullAnimation = requestAnimationFrame(frame);
      }
      fullAnimation = requestAnimationFrame(frame);
    }
    function fromHash() {
      const state = new URLSearchParams(location.hash.slice(1)).get("state");
      return ["1", "2", "3", "4"].includes(state) ? Number(state) : 1;
    }
    function render(state = fromHash()) {
      const previous = document.body.dataset.state;
      if (state !== 4) cancelAnimationFrame(fullAnimation);
      else if (previous !== "4") animateFullHistory();
      document.body.dataset.state = String(state);
      select.value = String(state); back.disabled = state === 1; next.disabled = state === 4;
      document.getElementById("initial-history").setAttribute("aria-hidden", String(state === 4));
      full.setAttribute("aria-hidden", String(state !== 4));
      for (const element of document.querySelectorAll(".reveal")) element.setAttribute("aria-hidden", String(state === 1));
      early.setAttribute("aria-hidden", String(state === 3));
      document.getElementById("stitch-join").setAttribute("aria-hidden", String(state !== 3));
      document.getElementById("chart-desc").textContent = state === 4
        ? "Texas stitched history with 456 reconstructed weeks followed by 261 observed weeks. The reconstructed history retains its 728-day forward shift. Observed weekly counts extend from July 3, 2021 through June 27, 2026, on an axis ending July 1, 2026. The vertical axis expands to 5,000 admissions."
        : state === 3
        ? "Texas stitched training sequence. The reconstructed history shifts forward 728 days, or 104 weeks, without changing any values. Its last point is indexed June 26, 2021, followed by the first retained observed point on July 3, 2021. Earlier observed weeks are excluded. The axis now represents the training time index, not the reconstructed seasons' original calendar dates."
        : "Texas weekly reported influenza hospital admissions from January 2020 through October 2022, shown as a solid gray line on a calendar beginning in September 2009." + (state === 2 ? " A dashed teal line adds the saved ILINet-based reconstruction from October 2010 through June 2019. These are estimated historical admissions, not observations. Original calendar dates are restored, and no line bridges the gap between reconstructed and observed records." : " The earlier years are left empty. Advance to reveal the reconstructed hospitalization history.");
    }
    function go(state) { location.hash = `state=${Math.max(1, Math.min(4, state))}`; }
    select.addEventListener("change", () => go(Number(select.value)));
    back.addEventListener("click", () => go(fromHash() - 1));
    next.addEventListener("click", () => go(fromHash() + 1));
    addEventListener("hashchange", () => render());
    addEventListener("keydown", event => {
      if (["SELECT", "INPUT", "BUTTON", "A"].includes(document.activeElement.tagName)) return;
      if (event.key === "ArrowRight" || event.key === "ArrowLeft") { event.preventDefault(); go(fromHash() + (event.key === "ArrowRight" ? 1 : -1)); }
    });
    render(fromHash() >= 3 ? fromHash() - 1 : fromHash());
    requestAnimationFrame(() => requestAnimationFrame(() => {
      document.body.dataset.ready = "true";
      render();
    }));
  </script>
</body>
</html>
