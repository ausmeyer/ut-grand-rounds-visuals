<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <meta name="color-scheme" content="light">
  <title>Influenza surveillance synthesis</title>
  <style>
    :root { --ink: #14242b; --muted: #647278; --paper: #fbfaf6; --line: #d5dad6; }
    * { box-sizing: border-box; }
    html, body { width: 1240px; height: 540px; margin: 0; overflow: hidden; }
    body {
      background: var(--paper);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-variant-numeric: tabular-nums;
    }
    .app { width: 1240px; height: 540px; padding: 16px; }
    .frame {
      height: 508px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: #fff;
      box-shadow: 0 8px 24px rgb(28 49 50 / 7%);
    }
    header { display: flex; align-items: end; justify-content: space-between; height: 40px; padding: 12px 18px 8px; }
    .eyebrow { color: #0a6670; font-size: 11px; font-weight: 840; letter-spacing: .12em; text-transform: uppercase; }
    .matrix { display: grid; grid-template-rows: 34px repeat(5, 83px); padding: 0 16px; }
    .row {
      display: grid;
      grid-template-columns: 122px 149px 171px 223px 193px 112px 1fr;
      align-items: center;
      min-width: 0;
      border-top: 1px solid var(--line);
    }
    .row:last-child { border-bottom: 1px solid var(--line); }
    .header-row { border-top: 0; color: var(--muted); }
    .cell { min-width: 0; padding: 0 8px; font-size: 11.5px; font-weight: 650; line-height: 1.25; }
    .detail { display: block; margin-top: 4px; color: var(--muted); font-size: 10.5px; font-weight: 600; line-height: 1.25; }
    .series { font-weight: 800; }
    .age-band { white-space: nowrap; }
    .header-row .cell { font-size: 9.5px; font-weight: 840; letter-spacing: .065em; text-transform: uppercase; }
    .system-cell { display: flex; align-items: center; gap: 10px; padding-left: 4px; font-size: 15px; font-weight: 860; letter-spacing: -.015em; }
    .system-rule { width: 5px; height: 42px; border-radius: 3px; background: var(--row-color); }
    .observes { color: #2e4148; font-weight: 760; }
    .limit { color: #3c4d53; }
    .depth {
      display: inline-block;
      border-bottom: 3px solid var(--row-color);
      padding-bottom: 2px;
      color: #2e4148;
      font-weight: 780;
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="frame">
      <header>
        <div class="eyebrow">Five complementary views of influenza</div>
      </header>
      <div class="matrix" id="matrix">
        <div class="row header-row">
          <div class="cell">System</div><div class="cell">Observed signal</div><div class="cell">Geographic breadth</div>
          <div class="cell">History</div><div class="cell">Age groups</div><div class="cell">Reporting cadence</div><div class="cell">Interpretive limit</div>
        </div>
      </div>
    </section>
  </main>
  <script>
    "use strict";
    const config = /*__SLIDE_CONFIG__*/;
    const data = /*__SLIDE_DATA__*/;
    const matrix = document.getElementById("matrix");
    config.rows.forEach((row) => {
      const item = document.createElement("div");
      item.className = "row";
      item.style.setProperty("--row-color", row.color);
      item.innerHTML = `
        <div class="cell system-cell"><span class="system-rule"></span><span>${row.name}</span></div>
        <div class="cell observes">${row.signal}</div>
        <div class="cell">${row.geography}<span class="detail">${row.coverage}</span></div>
        <div class="cell"><span class="series">${row.series}</span><span class="detail">${row.networkSince}</span></div>
        <div class="cell"><span class="depth">${row.ageSummary}</span><span class="detail">${row.ageDetail.replace(/\d+–\d+|≥\d+/g, '<span class="age-band">$&</span>')}</span></div>
        <div class="cell">${row.timeliness}</div>
        <div class="cell limit">${row.limitation}</div>`;
      matrix.appendChild(item);
    });
  </script>
</body>
</html>
