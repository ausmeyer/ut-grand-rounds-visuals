<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Slide 30 · When can forecasts improve the decision?</title>
  <style>
    :root { --paper:#fbfaf6; --ink:#14242b; --muted:#647278; --teal:#0a6670; --red:#933a4b; }
    * { box-sizing:border-box; }
    html,body { width:100%; height:100%; margin:0; overflow:hidden; }
    body { background:var(--paper); color:var(--ink); font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; }
    .slide { position:absolute; width:1280px; height:720px; left:50%; top:50%; transform:translate(-50%,-50%) scale(var(--scale,1)); transform-origin:center; }
    h1 { position:absolute; left:50px; top:48px; width:1180px; margin:0; font-family:Montserrat,Inter,ui-sans-serif,system-ui,sans-serif; font-size:36px; line-height:1.22; font-weight:550; letter-spacing:-.8px; }
    .visual { position:absolute; left:20px; top:113px; width:1240px; height:587px; }
    svg { display:block; width:1208px; height:535px; margin:0 16px; overflow:visible; }
    svg text { fill:var(--ink); font-family:inherit; }
    .axis { fill:var(--muted); font-size:14px; }
    .plot-title { font-size:21px; font-weight:650; }
    .sample { fill:none; stroke-linejoin:round; stroke-linecap:round; }
    .grid { stroke:#dfe4df; stroke-width:1; }
    .link { fill:none; stroke:#93a49f; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
    .controls { height:49px; padding:11px 29px 0; display:flex; align-items:center; gap:10px; }
    button { border:1px solid #b9c3c0; border-radius:8px; background:white; color:var(--ink); height:34px; font:inherit; font-size:14px; font-weight:650; cursor:pointer; padding:0 17px; white-space:nowrap; }
    button:hover { border-color:var(--teal); }
    button[aria-pressed=true] { color:var(--teal); border-color:var(--teal); background:#edf6f4; }
    button:focus-visible { outline:3px solid #82bcc1; outline-offset:3px; }
    #reset { padding:0 10px; font-size:19px; margin-left:auto; }
    #control-hint { color:var(--muted); font-size:13px; margin-left:9px; }
    .sr-only { position:absolute; width:1px; height:1px; overflow:hidden; clip-path:inset(50%); }
    </style>
</head>
<body>
  <main class="slide" aria-label="Slide 30. When can forecasts improve the decision?">
    <h1>When can forecasts improve the decision?</h1>
    <section class="visual" aria-label="Pre-pandemic vaccination scenarios and a threshold tested on later seasons">
      <svg viewBox="0 0 1208 535" role="img" aria-labelledby="chart-title chart-desc">
        <title id="chart-title">Each scenario has its own best vaccination date</title>
        <desc id="chart-desc"></desc>
        <text x="64" y="23" font-size="15" font-weight="650" style="fill:var(--teal)">NEXT STUDY</text>
        <text id="sample-count" x="1154" y="23" text-anchor="end" class="axis"></text>
        <g id="scenario-view">
        <text class="plot-title" x="64" y="61">Possible influenza seasons</text>
        <text class="axis" x="64" y="84">Weekly outpatient ILI</text>
        <text id="season-label" class="axis" x="424" y="84" text-anchor="end"></text>
        <g id="burden-grid"></g>
        <g id="epidemic-curves"></g>
        <g id="epidemic-markers"></g>
        <g id="season-axis"></g>
        <text class="plot-title" x="64" y="317">Vaccine protection</text>
        <text class="axis" x="64" y="340">Aligned to each optimal vaccination date</text>
        <g id="protection-grid"></g>
        <g id="protection-curves"></g>
        <g id="protection-markers"></g>
        <g id="protection-axis"></g>
        <path d="M444 183 H475 V292 H613 M444 421 H459 Q475 421 475 405 V292 M603 286 L613 292 L603 298" class="link"/>
        <text x="544" y="241" text-anchor="middle" font-size="15" font-weight="600">Compare every</text>
        <text x="544" y="262" text-anchor="middle" font-size="15" font-weight="600">vaccination date</text>
        <text class="plot-title" x="680" y="61">Timing regret</text>
        <text class="axis" x="680" y="84">Burden avoidable by changing the dose date</text>
        <g id="decision-grid"></g>
        <g id="decision-curves"></g>
        <g id="decision-markers"></g>
        <g id="decision-axis"></g>
        </g>
        <g id="alignment-view" style="display:none">
          <line x1="64" x2="84" y1="56" y2="56" stroke="#a4b0b0" stroke-width="2"/>
          <text x="92" y="61" class="axis">Seasons</text>
          <line x1="176" x2="196" y1="56" y2="56" stroke="#0a6670" stroke-width="3"/>
          <text x="204" y="61" class="axis">Aligned mean</text>
          <circle cx="341" cy="56" r="4.5" fill="#933a4b"/>
          <text x="353" y="61" class="axis">Optimal dates</text>
          <g id="alignment-grid"></g>
          <g id="alignment-band"></g>
          <g id="aligned-profiles"></g>
          <g id="alignment-mean"></g>
          <g id="alignment-axis"></g>
          <text x="462" y="528" text-anchor="middle" class="axis">Weeks from the aligned mean peak</text>
          <g id="alignment-summary">
            <text x="1040" y="213" text-anchor="middle" font-size="16" style="fill:var(--muted)">Pre-pandemic threshold</text>
            <text id="threshold-value" x="1040" y="274" text-anchor="middle" font-size="48" font-weight="600" style="fill:var(--teal)"></text>
            <text x="1040" y="308" text-anchor="middle" font-size="18">August baseline</text>
            <text x="1040" y="344" text-anchor="middle" class="axis">From 5,000 paired draws</text>
          </g>
        </g>
        <g id="threshold-view" style="display:none">
          <line x1="64" x2="84" y1="56" y2="56" stroke="#a4b0b0" stroke-width="2"/>
          <text x="92" y="61" class="axis">Later seasons</text>
          <circle cx="253" cy="56" r="4.5" fill="#933a4b"/>
          <text x="265" y="61" class="axis">Optimal dates</text>
          <circle cx="425" cy="56" r="4.5" fill="#fbfaf6" stroke="#0a6670" stroke-width="2"/>
          <text x="437" y="61" class="axis">Threshold dates</text>
          <g id="threshold-grid"></g>
          <g id="threshold-profiles"></g>
          <g id="threshold-rules"></g>
          <g id="threshold-markers"></g>
          <g id="threshold-axis"></g>
          <text x="462" y="528" text-anchor="middle" class="axis">Calendar date</text>
          <g id="threshold-comparison">
            <text x="1040" y="173" text-anchor="middle" font-size="18">Median gap to optimum</text>
            <text id="fixed-label" x="973" y="218" text-anchor="middle" font-size="16" style="fill:var(--muted)"></text>
            <text x="1100" y="218" text-anchor="middle" font-size="16" style="fill:var(--teal)">Threshold</text>
            <text id="fixed-gap" x="973" y="262" text-anchor="middle" font-size="32" font-weight="600"></text>
            <text id="threshold-gap" x="1100" y="262" text-anchor="middle" font-size="32" font-weight="600" style="fill:var(--teal)"></text>
            <text x="1040" y="330" text-anchor="middle" font-size="17">Benefit vs. optimum</text>
            <text id="fixed-retained" x="973" y="370" text-anchor="middle" font-size="26" font-weight="600"></text>
            <text id="threshold-retained" x="1100" y="370" text-anchor="middle" font-size="26" font-weight="600" style="fill:var(--teal)"></text>
            <text x="1040" y="410" text-anchor="middle" class="axis">Across all 5,000 pairs</text>
          </g>
        </g>
      </svg>
      <div class="controls">
        <button id="start" aria-pressed="true">1 · Start</button>
        <button id="one" aria-pressed="false">2 · One scenario</button>
        <button id="samples" aria-pressed="false">3 · Sample scenarios</button>
        <button id="align" aria-pressed="false">4 · Align seasons</button>
        <button id="threshold" aria-pressed="false">5 · Test a threshold</button>
        <span id="control-hint">Arrow keys to advance</span>
        <button id="reset" aria-label="Reset demonstration" title="Reset">↺</button>
      </div>
      <output id="status" class="sr-only" aria-live="polite"></output>
    </section>
  </main>
  <script>
    const DATA = /*__SLIDE_DATA__*/;
    const $ = id => document.getElementById(id);
    const NS = 'http://www.w3.org/2000/svg';
    const LX = t => 64+(t+.5)/40*360;
    const BY = burden => 250-burden/DATA.burden_y_max*138;
    const PY = protection => 477-protection/DATA.protection_y_max*106;
    const DX = t => 680+t/29*474, DY = regret => 477-regret/DATA.regret_y_max*365;
    const buttons = ['start','one','samples','align','threshold'];
    const reducedMotion = matchMedia('(prefers-reduced-motion:reduce)').matches;
    let stage = 1, animation = 0;
    function element(tag,attrs,parent,text) {
      const el=document.createElementNS(NS,tag);
      for(const [key,value] of Object.entries(attrs)) el.setAttribute(key,value);
      if(text!==undefined) el.textContent=text;
      parent.appendChild(el); return el;
    }
    function path(points,X,Y) { return points.map(([t,v],i)=>`${i?'L':'M'}${X(t).toFixed(3)},${Y(v).toFixed(3)}`).join(' '); }
    for(const value of [0,DATA.burden_y_max/2,DATA.burden_y_max]) {
      element('line',{x1:64,x2:424,y1:BY(value),y2:BY(value),class:'grid'},$('burden-grid'));
      element('text',{x:54,y:BY(value)+5,'text-anchor':'end',class:'axis'},$('burden-grid'),`${+(value*100).toFixed(1)}%`);
    }
    for(const value of [0,.4,.8]) {
      element('line',{x1:64,x2:424,y1:PY(value),y2:PY(value),class:'grid'},$('protection-grid'));
      element('text',{x:54,y:PY(value)+5,'text-anchor':'end',class:'axis'},$('protection-grid'),`${value*100}%`);
    }
    for(const [t,label] of [[0,'Sep'],[9,'Nov'],[18,'Jan'],[27,'Mar'],[36,'May']]) {
      element('text',{x:LX(t),y:274,'text-anchor':'middle',class:'axis'},$('season-axis'),label);
      element('text',{x:LX(t),y:501,'text-anchor':'middle',class:'axis'},$('protection-axis'),label);
      if(t<=29) element('text',{x:DX(t),y:501,'text-anchor':'middle',class:'axis'},$('decision-axis'),label);
    }
    for(const fraction of [0,.5,1]) element('line',{x1:680,x2:1154,y1:DY(fraction*DATA.regret_y_max),y2:DY(fraction*DATA.regret_y_max),class:'grid'},$('decision-grid'));
    element('text',{x:665,y:121,'text-anchor':'end',class:'axis'},$('decision-grid'),'More');
    element('text',{x:665,y:482,'text-anchor':'end',class:'axis'},$('decision-grid'),'0');
    const graphics=DATA.scenarios.map(s=>{
      const burden=[...s.burden_points];
      burden.unshift([burden[0][0]-.5,burden[0][1]]); burden.push([burden.at(-1)[0]+.5,burden.at(-1)[1]]);
      const curves=[
        element('path',{d:path(burden,LX,BY),class:'sample','data-draw':s.draw},$('epidemic-curves')),
        element('path',{d:path(s.protection_points,LX,PY),class:'sample','data-draw':s.draw},$('protection-curves')),
        element('path',{d:path(s.decision_points,DX,DY),class:'sample','data-draw':s.draw},$('decision-curves'))
      ];
      const markers=[
        element('circle',{cx:LX(s.dose_time),cy:BY(s.epidemic_at_dose)},$('epidemic-markers')),
        element('circle',{cx:LX(s.dose_time),cy:PY(s.protection_at_dose)},$('protection-markers')),
        element('circle',{cx:DX(s.dose_time),cy:DY(s.decision_points[s.best_index][1])},$('decision-markers'))
      ];
      markers.forEach(mark=>{
        for(const [key,value] of Object.entries({r:5,fill:'#933a4b',stroke:'#fbfaf6','stroke-width':1.2,'data-draw':s.draw,'data-week':s.best_week,'data-time':s.dose_time})) mark.setAttribute(key,value);
      });
      return {curves,markers};
    });
    const alignment=DATA.alignment, threshold=DATA.threshold_example;
    const plotMax=Math.max(alignment.y_max,threshold.y_max), multiplier=threshold.fit.threshold_multiplier;
    const AX=t=>64+(t-alignment.x_min)/(alignment.x_max-alignment.x_min)*796;
    const AY=v=>470-v/plotMax*370;
    for(const value of [0,plotMax/2,plotMax]) {
      element('line',{x1:64,x2:860,y1:AY(value),y2:AY(value),class:'grid'},$('alignment-grid'));
      element('text',{x:53,y:AY(value)+5,'text-anchor':'end',class:'axis'},$('alignment-grid'),`${value}×`);
    }
    element('text',{x:64,y:87,class:'axis'},$('alignment-grid'),'Activity / August baseline');
    for(let t=Math.ceil(alignment.x_min/8)*8;t<=alignment.x_max;t+=8) element('text',{x:AX(t),y:496,'text-anchor':'middle',class:'axis'},$('alignment-axis'),t===0?'Peak':`${t>0?'+':''}${t}`);
    element('line',{x1:AX(0),x2:AX(0),y1:100,y2:470,stroke:'#a4b0b0','stroke-dasharray':'3 5'},$('alignment-grid'));
    element('rect',{x:AX(alignment.after.q1),y:100,width:AX(alignment.after.q3)-AX(alignment.after.q1),height:370,fill:'#933a4b',opacity:.08},$('alignment-band'));
    const alignmentGraphics=alignment.profiles.map(profile=>{
      const group=element('g',{'data-draw':profile.draw,'data-shift':profile.shift},$('aligned-profiles'));
      element('path',{d:path(profile.points,AX,AY),class:'sample',stroke:'#a4b0b0','stroke-width':1.1,opacity:.38},group);
      element('circle',{cx:AX(profile.optimal_time_before),cy:AY(profile.optimal_height),r:3.4,fill:'#933a4b',opacity:.65,stroke:'#fbfaf6','stroke-width':.8},group);
      return group;
    });
    element('path',{d:path(alignment.mean_points,AX,AY),class:'sample',stroke:'#0a6670','stroke-width':3.2},$('alignment-mean'));
    element('line',{x1:64,x2:860,y1:AY(multiplier),y2:AY(multiplier),stroke:'#0a6670','stroke-width':1.7,'stroke-dasharray':'6 5'},$('alignment-mean'));
    element('text',{x:848,y:AY(multiplier)-9,'text-anchor':'end','font-size':15,style:'fill:var(--teal)'},$('alignment-mean'),`${multiplier.toFixed(1)}×`);
    $('threshold-value').textContent=`${multiplier.toFixed(1)}×`;
    const TX=t=>64+(t+.5)/40*796;
    for(const value of [0,plotMax/2,plotMax]) {
      element('line',{x1:64,x2:860,y1:AY(value),y2:AY(value),class:'grid'},$('threshold-grid'));
      element('text',{x:53,y:AY(value)+5,'text-anchor':'end',class:'axis'},$('threshold-axis'),`${value}×`);
    }
    element('text',{x:64,y:87,class:'axis'},$('threshold-grid'),'Activity / August baseline');
    for(const [week,label] of [[0,'Sep'],[9,'Nov'],[18,'Jan'],[27,'Mar'],[36,'May']]) element('text',{x:TX(week),y:496,'text-anchor':'middle',class:'axis'},$('threshold-axis'),label);
    element('line',{x1:64,x2:860,y1:AY(multiplier),y2:AY(multiplier),stroke:'#0a6670','stroke-width':1.7,'stroke-dasharray':'6 5'},$('threshold-rules'));
    element('text',{x:848,y:AY(multiplier)-9,'text-anchor':'end','font-size':15,style:'fill:var(--teal)'},$('threshold-rules'),`${multiplier.toFixed(1)}×`);
    const fixedTime=threshold.scenarios[0].fixed_time;
    element('line',{x1:TX(fixedTime),x2:TX(fixedTime),y1:100,y2:470,stroke:'#647278','stroke-width':1.5,'stroke-dasharray':'3 5'},$('threshold-rules'));
    element('text',{x:TX(fixedTime)-9,y:122,'text-anchor':'end','font-size':15,style:'fill:var(--muted)'},$('threshold-rules'),`Fixed week ${threshold.fit.fixed_week}`);
    threshold.scenarios.forEach(row=>{
      const points=[...row.burden_points];
      points.unshift([points[0][0]-.5,points[0][1]]); points.push([points.at(-1)[0]+.5,points.at(-1)[1]]);
      element('path',{d:path(points,TX,AY),class:'sample',stroke:'#a4b0b0','stroke-width':1.1,opacity:.38,'data-draw':row.draw,'data-season':row.season},$('threshold-profiles'));
      row.optimal_times.forEach((time,i)=>element('circle',{cx:TX(time),cy:AY(row.optimal_heights[i]),r:3.5,fill:'#933a4b',opacity:.7,stroke:'#fbfaf6','stroke-width':.8,'data-draw':row.draw,'data-kind':'optimal','data-time':time},$('threshold-markers')));
      if(row.threshold_time!==null) element('circle',{cx:TX(row.threshold_time),cy:AY(row.threshold_height),r:4.4,fill:'#fbfaf6',stroke:'#0a6670','stroke-width':1.7,opacity:.8,'data-draw':row.draw,'data-kind':'threshold','data-time':row.threshold_time},$('threshold-markers'));
    });
    $('fixed-label').textContent=`Week ${threshold.fit.fixed_week}`;
    for(const policy of ['fixed','threshold']) {
      $(policy+'-gap').textContent=`${threshold.summary[policy].median_absolute_weeks} wk`;
      $(policy+'-retained').textContent=`${((1-threshold.summary[policy].pooled_relative_loss)*100).toFixed(1)}%`;
    }
    function revealThreshold(progress) {
      $('threshold-markers').style.opacity=progress;
      $('threshold-comparison').style.opacity=progress;
      $('threshold-view').dataset.progress=progress;
    }
    function alignSeasons(progress) {
      alignmentGraphics.forEach((group,i)=>group.setAttribute('transform',`translate(${AX(progress*alignment.profiles[i].shift)-AX(0)} 0)`));
      $('alignment-view').dataset.progress=progress;
      for(const id of ['alignment-band','alignment-mean','alignment-summary']) $(id).style.display=progress===1?'':'none';
    }
    function samples(count,active=-1,showDates=true) {
      graphics.forEach((graphic,i)=>{
        const selected=i===active;
        graphic.curves.forEach((curve,panel)=>{
          curve.style.opacity='';
          curve.style.display=i<count&&(panel<2||showDates)?'':'none';
          curve.setAttribute('stroke',panel===0?(selected?'#647b7d':'#a4b0b0'):(selected?'#0a6670':'#7b9e9a'));
          curve.setAttribute('stroke-width',selected?2.6:1.1); curve.setAttribute('opacity',selected?1:[.35,.23,.35][panel]);
        });
        graphic.markers.forEach(mark=>{
          mark.style.display=i<count&&showDates?'':'none'; mark.style.opacity=selected?1:.5; mark.setAttribute('r',selected?5.5:3.4);
        });
      });
      $('season-label').textContent=active>=0?DATA.scenarios[active].season:'';
      $('sample-count').textContent=`${count} of ${DATA.n_draws.toLocaleString('en-US')} pre-pandemic pairs`;
    }
    function animate(duration,tick,done=()=>{}) {
      const start=performance.now();
      function frame(now) {
        const p=Math.max(0,Math.min(1,(now-start)/duration)); tick(p);
        if(p<1) animation=requestAnimationFrame(frame); else done();
      }
      animation=requestAnimationFrame(frame);
    }
    function setStage(value,play=true) {
      const previous=stage;
      cancelAnimationFrame(animation); stage=Math.max(1,Math.min(5,Math.floor(value))); value=stage;
      document.body.dataset.state=value; history.replaceState(null,'',`#state=${value}`);
      buttons.forEach((id,i)=>$(id).setAttribute('aria-pressed',value===i+1));
      $('scenario-view').style.display=value>=4?'none':'';
      $('alignment-view').style.display=value===4?'':'none';
      $('threshold-view').style.display=value===5?'':'none';
      $('alignment-view').style.opacity=1; $('threshold-view').style.opacity=1;
      $('chart-title').textContent=value===5?'A pre-pandemic threshold tested on 5,000 later-season pairs':value===4?'Optimal dates after aligning epidemic curves':'Each scenario has its own best vaccination date';
      if(value===1) samples(1,0,false);
      else if(value===2) {
        samples(1,0);
        if(play&&value>previous&&!reducedMotion) {
          const reveal=[graphics[0].curves[2],...graphics[0].markers]; reveal.forEach(el=>el.style.opacity=0);
          animate(600,p=>reveal.forEach(el=>el.style.opacity=p));
        }
      } else if(value===3) {
        if(play&&value>previous&&!reducedMotion) {
          samples(1,0);
          let shown=1;
          animate(8000,p=>{const count=Math.min(graphics.length,1+Math.floor(p*graphics.length)); if(count!==shown) { samples(count,count-1); shown=count; }},()=>{
            samples(graphics.length);
          });
        } else { samples(graphics.length); }
      } else if(value===4) {
        $('sample-count').textContent='Pre-pandemic seasons · 2011–19';
        if(play&&value>previous&&!reducedMotion) {
          alignSeasons(0); animate(1800,p=>alignSeasons(p*p*(3-2*p)));
        } else alignSeasons(1);
      } else {
        $('sample-count').textContent='50 of 5,000 later-season pairs · 2023–26';
        if(play&&value>previous&&!reducedMotion) {
          revealThreshold(0);
          if(previous===4) {
            $('alignment-view').style.display=''; $('threshold-view').style.opacity=0;
            animate(1400,p=>{
              const incoming=Math.max(0,Math.min(1,(p-.2)/.65));
              $('alignment-view').style.opacity=1-Math.min(1,p/.65);
              $('threshold-view').style.opacity=incoming*incoming*(3-2*incoming);
              revealThreshold(Math.max(0,Math.min(1,(p-.55)/.45)));
            },()=>{$('alignment-view').style.display='none';revealThreshold(1);});
          } else animate(700,revealThreshold);
        } else revealThreshold(1);
      }
      const desc=[
        '',
        'One pre-pandemic epidemic and vaccine-protection pair. Advance to reveal its best vaccination date.',
        `The regret curve reaches its calculated minimum at week ${DATA.scenarios[0].best_week}. Red dots mark that same dose date on the epidemic and calendar-aligned protection curves. Protection begins after the saved immune-response delay.`,
        `${DATA.scenarios.length} pre-pandemic pairs appear in sequence, each with a calculated regret minimum and matching dose-date dots. They are the first 50 of 5,000 seeded draws from 2011/12 through 2018/19, with pre-pandemic VE estimates.`,
        `These 50 pre-pandemic curves are shifted by maximum shared area after AUC normalization. Displayed heights are divided by each draw's August baseline. Red optimal dates move with their curves and are not used to choose the shifts. Across all 5,000 training pairs, median activity at the optimal date gives a frozen threshold of ${multiplier.toFixed(1)} times baseline. The pale band is the middle half of the 50 aligned optimal dates.`,
        `Apply the frozen ${multiplier.toFixed(1)}-times-August-baseline rule and fixed week ${threshold.fit.fixed_week} to ${threshold.evaluation_n.toLocaleString()} pairs from 2023/24 through 2025/26. The first 50 are shown. Gray curves are post-pandemic latent epidemic draws; burgundy dots are their individual optima, and teal rings are the first eligible weeks above the threshold. Median absolute timing gaps are ${threshold.summary.fixed.median_absolute_weeks} wk for the fixed date and ${threshold.summary.threshold.median_absolute_weeks} wk for the threshold. Pooled retained modeled protection is ${((1-threshold.summary.fixed.pooled_relative_loss)*100).toFixed(1)} percent and ${((1-threshold.summary.threshold.pooled_relative_loss)*100).toFixed(1)} percent, respectively, relative to the sum of each draw's optimum. ${threshold.evaluation_n-threshold.summary.threshold.non_crossings} of ${threshold.evaluation_n} cross the threshold. This August-baseline variant is an exploratory sensitivity analysis chosen after reviewing the early-season results. It uses revised-data, full-season latent curves, not a real-time surveillance evaluation or a validated clinical recommendation.`
      ][value];
      $('chart-desc').textContent=desc; $('status').textContent=desc;
    }
    buttons.forEach((id,i)=>$(id).addEventListener('click',()=>setStage(i+1)));
    $('reset').addEventListener('click',()=>setStage(1,false));
    document.addEventListener('keydown',event=>{
      if(event.repeat||(event.target.tagName==='BUTTON'&&event.key===' ')) return;
      if(['ArrowRight','PageDown',' ','ArrowLeft','PageUp','Home'].includes(event.key)) {
        event.preventDefault();
        const next=event.key==='Home'?1:['ArrowLeft','PageUp'].includes(event.key)?Math.max(1,stage-1):Math.min(5,stage+1);
        if(next!==stage) setStage(next);
      }
    });
    function fit() { document.documentElement.style.setProperty('--scale',Math.min(innerWidth/1280,innerHeight/720)); }
    addEventListener('resize',fit); fit();
    const hash=new URLSearchParams(location.hash.slice(1));
    setStage(Math.max(1,Math.min(5,Math.floor(Number(hash.get('state'))||1))),false);
  </script>
</body>
</html>
