<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>FluSight forecast targets and scoring</title>
  <style>
    :root { --ink: #14242b; --muted: #647278; --teal: #0a6670; --paper: #fbfaf6; --line: #d5dad6; }
    * { box-sizing: border-box; }
    html, body { width: 1240px; height: 540px; margin: 0; overflow: hidden; }
    body { background: var(--paper); color: var(--ink); font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-variant-numeric: tabular-nums; }
    .app { width: 1240px; height: 540px; display: grid; grid-template-rows: 38px 1fr; gap: 8px; padding: 10px 16px 8px; }
    .topbar, .controls { display: flex; align-items: center; }
    .topbar { justify-content: space-between; gap: 16px; }
    .subtitle { color: #42535a; font-size: 16px; font-weight: 670; }
    .controls { gap: 7px; }
    .controls label { color: var(--muted); font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .07em; margin-right: 3px; }
    button, select { height: 32px; border: 1px solid #b9c3c0; border-radius: 8px; background: white; color: var(--ink); font: inherit; font-weight: 740; }
    select { width: 231px; padding: 0 32px 0 10px; font-size: 13px; }
    button { width: 34px; padding: 0; font-size: 17px; cursor: pointer; }
    button:hover { border-color: var(--teal); color: var(--teal); }
    button:disabled { opacity: .35; cursor: default; }
    :focus-visible { outline: 3px solid #82bcc1; outline-offset: 2px; }
    .frame { padding: 17px 24px; border: 1px solid var(--line); border-radius: 14px; background: white; box-shadow: 0 8px 24px rgb(28 49 50 / 7%); }
    #chart { display: block; width: 1158px; height: 438px; }
    svg { font-size: 18px; }
    svg text { fill: var(--ink); }
    .muted { fill: var(--muted); }
    .teal { fill: var(--teal); }
    .tick { fill: var(--muted); font-size: 16px; }
    .direct-label { fill: var(--teal); font-size: 18px; font-weight: 650; }
    .quantile-heading { font-size: 24px; font-weight: 720; }
    .scoring { opacity: 0; visibility: hidden; }
    body[data-state="2"] .scoring { opacity: 1; visibility: visible; }
    body[data-ready] .scoring { transition: opacity 280ms ease, visibility 280ms; }
    @media (prefers-reduced-motion: reduce) { body[data-ready] .scoring { transition: none; } }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="subtitle">Weekly laboratory-confirmed influenza hospital admissions</div>
      <div class="controls"><label for="state-select">View</label><button id="back-button" aria-label="Previous view">←</button><select id="state-select" aria-label="Forecast targets and scoring view"><option value="1">1 · Forecast targets</option><option value="2">2 · How we score it</option></select><button id="next-button" aria-label="Next view">→</button></div>
    </header>
    <section class="frame">
      <svg id="chart" viewBox="0 0 1158 438" role="img" aria-labelledby="chart-title chart-desc">
        <title id="chart-title">Influenza forecast targets and probabilistic accuracy</title>
        <desc id="chart-desc"></desc>
        <g id="forecast-plot"></g>
        <g class="scoring" id="scoring" aria-hidden="true">
          <line x1="76" x2="1124" y1="330" y2="330" stroke="#d5dad6"/>
          <text x="76" y="359" font-size="22" font-weight="700">WIS</text>
          <text x="241" y="359" font-size="20">scores interval width and missed observations.</text>
          <text x="970" y="359" class="teal" font-weight="700">Lower is better.</text>
          <text x="76" y="405" font-size="22" font-weight="700">Relative WIS</text>
          <text x="241" y="405" font-size="20">compares WIS with a persistence baseline.</text>
          <text x="970" y="405" class="teal" font-weight="700">Below 1 is better.</text>
        </g>
      </svg>
    </section>
  </main>
  <script>
    "use strict";
    const data = {"slide":15,"synthetic":true,"axis_max":1000,"history":[{"week":-5,"value":110},{"week":-4,"value":155},{"week":-3,"value":230},{"week":-2,"value":305},{"week":-1,"value":390}],"forecasts":[{"horizon":0,"quantiles":{"0.01":347.341,"0.025":364.285,"0.05":379.518,"0.1":397.872,"0.15":410.755,"0.2":421.29,"0.25":430.544,"0.3":439.027,"0.35":447.037,"0.4":454.773,"0.45":462.384,"0.5":470.0,"0.55":477.741,"0.6":485.737,"0.65":494.143,"0.7":503.158,"0.75":513.072,"0.8":524.342,"0.85":537.79,"0.9":555.203,"0.95":582.054,"0.975":606.393,"0.99":635.974}},{"horizon":1,"quantiles":{"0.01":334.228,"0.025":358.323,"0.05":380.432,"0.1":407.619,"0.15":427.052,"0.2":443.156,"0.25":457.454,"0.3":470.687,"0.35":483.291,"0.4":495.562,"0.45":507.732,"0.5":520.0,"0.55":532.565,"0.6":545.643,"0.65":559.498,"0.7":574.48,"0.75":591.098,"0.8":610.17,"0.85":633.178,"0.9":663.364,"0.95":710.772,"0.975":754.626,"0.99":809.029}},{"horizon":2,"quantiles":{"0.01":314.692,"0.025":343.617,"0.05":370.611,"0.1":404.376,"0.15":428.879,"0.2":449.407,"0.25":467.8,"0.3":484.958,"0.35":501.419,"0.4":517.555,"0.45":533.66,"0.5":550.0,"0.55":566.84,"0.6":584.479,"0.65":603.288,"0.7":623.765,"0.75":646.644,"0.8":673.109,"0.85":705.328,"0.9":748.066,"0.95":816.219,"0.975":880.341,"0.99":961.257}},{"horizon":3,"quantiles":{"0.01":297.157,"0.025":329.26,"0.05":359.631,"0.1":398.139,"0.15":426.424,"0.2":450.331,"0.25":471.906,"0.3":492.16,"0.35":511.704,"0.4":530.967,"0.45":550.293,"0.5":570.0,"0.55":590.413,"0.6":611.903,"0.65":634.937,"0.7":660.151,"0.75":688.485,"0.8":721.47,"0.85":761.917,"0.9":816.046,"0.95":903.427,"0.975":986.759,"0.99":1093.363}}],"quantile_count":23,"distribution":"Illustrative lognormal marginals; specified medians and log-scale spreads."};
    const plot = document.getElementById("forecast-plot");
    const select = document.getElementById("state-select"), back = document.getElementById("back-button"), next = document.getElementById("next-button");
    const x = week => 76 + (week + 5) * 112;
    const y = count => 280 - count / data.axis_max * 220;
    function add(tag, attributes, content) {
      const element = document.createElementNS("http://www.w3.org/2000/svg", tag);
      for (const [key, value] of Object.entries(attributes)) element.setAttribute(key, value);
      if (content !== undefined) element.textContent = content;
      plot.appendChild(element);
      return element;
    }
    function text(atX, atY, content, attributes = {}) { return add("text", {x: atX, y: atY, ...attributes}, content); }
    function path(points) { return points.map(([a, b], index) => `${index ? "L" : "M"}${a.toFixed(2)},${b.toFixed(2)}`).join(" "); }
    function band(lower, upper, opacity, name) {
      const top = data.forecasts.map(point => [x(point.horizon), y(point.quantiles[upper])]);
      const bottom = data.forecasts.slice().reverse().map(point => [x(point.horizon), y(point.quantiles[lower])]);
      add("path", {d: `${path(top)} ${path(bottom).replace(/^M/, "L")} Z`, fill: "#0a6670", "fill-opacity": opacity, class: name});
    }
    text(76, 26, `${data.quantile_count} quantiles per location and target week`, {class: "quantile-heading"});
    for (const value of [0, 250, 500, 750, 1000]) {
      add("line", {x1: 76, x2: 972, y1: y(value), y2: y(value), stroke: value === 0 ? "#aab7b7" : "#e8edeb"});
      text(65, y(value) + 5, value.toLocaleString("en-US"), {class: "tick", "text-anchor": "end"});
    }
    add("line", {x1: 76, x2: 76, y1: 60, y2: 280, stroke: "#aab7b7"});
    text(19, 170, "Hospital admissions", {transform: "rotate(-90 19 170)", "text-anchor": "middle", class: "muted"});
    add("line", {x1: x(-.5), x2: x(-.5), y1: 60, y2: 280, stroke: "#aab7b7", "stroke-dasharray": "5 6", class: "forecast-boundary"});
    text(300, 53, "Observed", {class: "tick", "text-anchor": "middle"});
    band("0.025", "0.975", .14, "interval-95");
    band("0.25", "0.75", .25, "interval-50");
    add("path", {d: path(data.history.map(point => [x(point.week), y(point.value)])), fill: "none", stroke: "#58666c", "stroke-width": 3.5, "stroke-linejoin": "round", class: "history"});
    for (const point of data.history) add("circle", {cx: x(point.week), cy: y(point.value), r: 4, fill: "#58666c"});
    add("path", {d: path(data.forecasts.map(point => [x(point.horizon), y(point.quantiles["0.5"])])), fill: "none", stroke: "#0a6670", "stroke-width": 4, "stroke-linejoin": "round", class: "forecast-median"});
    for (const point of data.forecasts) add("circle", {cx: x(point.horizon), cy: y(point.quantiles["0.5"]), r: 5, fill: "#0a6670", stroke: "white", "stroke-width": 2, class: "forecast-point"});
    const end = data.forecasts.at(-1).quantiles;
    for (const [quantile, label] of [["0.975", "95% interval"], ["0.75", "50% interval"], ["0.5", "Median"]]) {
      add("line", {x1: 978, x2: 990, y1: y(end[quantile]), y2: y(end[quantile]), stroke: "#0a6670", "stroke-width": 1.5});
      text(999, y(end[quantile]) + 6, label, {class: "direct-label"});
    }
    for (const [week, label] of [[-5, "5 weeks ago"], [-3, "3 weeks ago"], [-1, "Last week"], [0, "Current week"], [1, "+1 week"], [2, "+2 weeks"], [3, "+3 weeks"]]) {
      add("line", {x1: x(week), x2: x(week), y1: 280, y2: 287, stroke: "#aab7b7"});
      text(x(week), 310, label, {class: "tick", "text-anchor": "middle"});
    }
    function fromHash() { return new URLSearchParams(location.hash.slice(1)).get("state") === "2" ? 2 : 1; }
    function render() {
      const state = fromHash();
      document.body.dataset.state = String(state);
      select.value = String(state); back.disabled = state === 1; next.disabled = state === 2;
      document.getElementById("scoring").setAttribute("aria-hidden", String(state !== 2));
      document.getElementById("chart-desc").textContent = "Synthetic weekly influenza hospital admissions. The forecast covers the current week and the next three weeks, with 23 quantiles at each horizon. The median and central 50% and 95% prediction intervals are shown." + (state === 2 ? " Weighted interval score evaluates interval width and missed observations. Lower is better. Relative WIS compares WIS with a persistence baseline. Below one is better." : "");
    }
    function go(state) { location.hash = `state=${Math.max(1, Math.min(2, state))}`; }
    select.addEventListener("change", () => go(Number(select.value)));
    back.addEventListener("click", () => go(fromHash() - 1));
    next.addEventListener("click", () => go(fromHash() + 1));
    addEventListener("hashchange", render);
    addEventListener("keydown", event => {
      if (["SELECT", "INPUT", "BUTTON"].includes(document.activeElement.tagName)) return;
      if (event.key === "ArrowRight" || event.key === "ArrowLeft") { event.preventDefault(); go(fromHash() + (event.key === "ArrowRight" ? 1 : -1)); }
    });
    render();
    requestAnimationFrame(() => requestAnimationFrame(() => { document.body.dataset.ready = "true"; }));
  </script>
</body>
</html>
