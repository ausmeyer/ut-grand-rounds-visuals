    }
    function comparison(parent,location,center,top,compact=false) {
      const group=element('g',{'data-summary':location.name},parent), firstStage=compact?5:2;
      const headings=element('g',{'data-reveal':firstStage},group);
      const font=compact?14:18, valueFont=compact?23:28;
      element('text',{x:center,y:compact?top+42:173,'text-anchor':'middle','font-size':font},headings,'Median gap to optimum');
      element('text',{x:center,y:compact?top+106:330,'text-anchor':'middle','font-size':compact?14:17},headings,'Benefit vs. optimum');
      if(!compact) element('text',{x:center,y:410,'text-anchor':'middle',class:'axis'},headings,'Across all 5,000 pairs');
      for(const [i,policy] of ['guidance','fixed','threshold'].entries()) {
        const column=element('g',{'data-reveal':firstStage+i,'data-column':policy},group);
        const x=center+(i-1)*(compact?75:92), color=policy==='guidance'?'#8e6836':policy==='threshold'?'#0a6670':'#14242b', metrics=location.summary[policy];
        const label=policy==='guidance'?'Guidance':policy==='fixed'?'Fixed':'Threshold';
        const detail=policy==='guidance'?`Week ${DATA.fit.guidance_week}`:policy==='fixed'?`Week ${DATA.fit.fixed_week}`:`${DATA.fit.threshold_multiplier.toFixed(1)}×`;
        element('text',{x,y:compact?top+1:210,'text-anchor':'middle','font-size':compact?14:16,style:`fill:${color}`},column,label);
        element('text',{x,y:compact?top+18:231,'text-anchor':'middle','font-size':compact?12:14,style:'fill:var(--muted)'},column,detail);
        element('text',{x,y:compact?top+74:276,'text-anchor':'middle','font-size':valueFont,'font-weight':600,style:`fill:${color}`,'data-policy':policy,'data-metric':'gap'},column,`${metrics.median_absolute_weeks} wk`);
        element('text',{x,y:compact?top+136:370,'text-anchor':'middle','font-size':compact?20:23,'font-weight':600,style:`fill:${color}`,'data-policy':policy,'data-metric':'benefit'},column,`${((1-metrics.pooled_relative_loss)*100).toFixed(1)}%`);
      }
      if(location.summary.threshold.non_crossings) element('text',{x:center,y:compact?top+158:448,'text-anchor':'middle',class:'axis','data-reveal':firstStage+2},group,`${location.summary.threshold.non_crossings} / 5,000 did not cross`);
      return group;
    }
    const national=plot($('national-view'),DATA.national,64,100,796,370,DATA.national_y_max);
    national.summary=comparison($('national-view'),DATA.national,1040,0);
    element('text',{x:462,y:528,'text-anchor':'middle',class:'axis'},$('national-view'),'Calendar date');
    DATA.states.forEach((location,i)=>{
      const left=i%2?637:64, top=i<2?103:337;
      element('text',{x:left,y:top,'font-size':21,'font-weight':650},$('states-view'),location.name);
      plot($('states-view'),location,left,top+20,320,130,DATA.states_y_max,true);
      comparison($('states-view'),location,left+437,top,true);
    });
    const policyLayers=[...document.querySelectorAll('[data-reveal]')];
    function animate(duration,tick,done=()=>{}) {
      const start=performance.now();
      function frame(now) {
        const p=Math.max(0,Math.min(1,(now-start)/duration)); tick(p);
        if(p<1) animation=requestAnimationFrame(frame); else done();
      }
      animation=requestAnimationFrame(frame);
    }
    function setStage(value,play=true) {
      const previous=stage;
      cancelAnimationFrame(animation); stage=Math.max(1,Math.min(buttons.length,Math.floor(value)));
      document.body.dataset.state=stage; history.replaceState(null,'',`#state=${stage}`);
      buttons.forEach((id,i)=>$(id).setAttribute('aria-pressed',stage===i+1));
      const showingStates=stage>=5;
      $('national-view').style.display=showingStates?'none':''; $('states-view').style.display=showingStates?'':'none';
      $('national-view').style.opacity=1; $('states-view').style.opacity=1;
      $('policy-legend').style.display=stage===1?'none':'';
      $('threshold-legend').style.display=stage===4||stage===7?'':'none';
      $('sample-count').textContent=showingStates?'2022–23 · 50 of 5,000 draws per state':'US · 2022–23 · 50 of 5,000 paired draws';
      policyLayers.forEach(layer=>{
        const visible=Number(layer.dataset.reveal)<=stage;
        layer.style.opacity=visible?1:0; layer.style.visibility=visible?'visible':'hidden';
      });
      if(showingStates&&play&&previous<5&&!reducedMotion) {
        $('states-view').style.opacity=0; $('national-view').style.display='';
        animate(900,p=>{
          const incoming=p*p*(3-2*p);
          $('national-view').style.opacity=1-incoming; $('states-view').style.opacity=incoming;
        },()=>{$('national-view').style.display='none';});
      } else if(stage>1&&play&&previous<stage&&!reducedMotion) {
        const incoming=policyLayers.filter(layer=>Number(layer.dataset.reveal)>previous&&Number(layer.dataset.reveal)<=stage);
        incoming.forEach(layer=>layer.style.opacity=0);
        animate(700,p=>incoming.forEach(layer=>layer.style.opacity=p*p*(3-2*p)));
      }
      const visiblePolicies=['guidance','fixed','threshold'].slice(0,showingStates?stage-4:stage-1);
      const locations=showingStates?DATA.states:[DATA.national];
      const statements=locations.map(location=>`${location.name}: ${visiblePolicies.map(policy=>{
        const metrics=location.summary[policy], label=policy==='guidance'?`week ${DATA.fit.guidance_week}`:policy==='fixed'?`week ${DATA.fit.fixed_week}`:'threshold';
        return `${label}, median absolute gap ${metrics.median_absolute_weeks} weeks and retained modeled benefit ${((1-metrics.pooled_relative_loss)*100).toFixed(1)} percent`;
      }).join('; ')}.`).join(' ');
      const desc=stage===1?'The first 50 of 5,000 US 2022/23 epidemic and VE pairs. This landing view is still. Advances reveal vaccination in week 44, fixed week 47, then the activity threshold.':
        `${showingStates?'Texas, California, Minnesota, and New York':'United States'} in 2022/23. Each advance adds a rule: vaccination in week 44 near the end of the guidance window, the retained fixed week 47, then the frozen ${DATA.fit.threshold_multiplier.toFixed(1)} times local August baseline threshold. Week 44 models one specific dose week, not every date permitted by guidance. Each location uses 5,000 paired VE and epidemic draws, each with its own optimum. The first 50 curves are shown. Burgundy dots mark optima; teal rings mark threshold dates. ${statements} The August sensitivity analysis was selected after reviewing the September-baseline results. The multiplier was then calibrated using pre-pandemic draws only and frozen before recalculating evaluation outcomes. These are retrospective full-season latent curves, not an as-of-date evaluation, an untouched holdout, or a geographic holdout.`;
      $('chart-title').textContent=showingStates?'Vaccination timing compared in four states in 2022–23':'The early 2022–23 US season';
      $('chart-desc').textContent=desc; $('status').textContent=desc;
    }
    buttons.forEach((id,i)=>$(id).addEventListener('click',()=>setStage(i+1)));
    $('reset').addEventListener('click',()=>setStage(1,false));
    document.addEventListener('keydown',event=>{
      if(event.repeat||(event.target.tagName==='BUTTON'&&event.key===' ')) return;
      if(['ArrowRight','PageDown',' ','ArrowLeft','PageUp','Home'].includes(event.key)) {
        event.preventDefault();
        const next=event.key==='Home'?1:['ArrowLeft','PageUp'].includes(event.key)?Math.max(1,stage-1):Math.min(buttons.length,stage+1);
        if(next!==stage) setStage(next);
      }
    });
    function fit() { document.documentElement.style.setProperty('--scale',Math.min(innerWidth/1280,innerHeight/720)); }
    addEventListener('resize',fit); fit();
    const hash=new URLSearchParams(location.hash.slice(1));
    setStage(Math.max(1,Math.min(buttons.length,Math.floor(Number(hash.get('state'))||1))),false);
  </script>
</body>
</html>
