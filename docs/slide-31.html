        },()=>{$('national-view').style.display='none';});
      }
      const statements=DATA.states.map(location=>`${location.name}: median absolute gaps ${location.summary.fixed.median_absolute_weeks} and ${location.summary.threshold.median_absolute_weeks} weeks, and retained modeled benefit ${((1-location.summary.fixed.pooled_relative_loss)*100).toFixed(1)} and ${((1-location.summary.threshold.pooled_relative_loss)*100).toFixed(1)} percent, for fixed week 47 and threshold, respectively.`).join(' ');
      const desc=[
        '',
        'The first 50 of 5,000 US 2022/23 epidemic and VE pairs. This landing view is still. Advance to reveal the two frozen timing rules and their results.',
        'The unchanged pre-pandemic rules are fixed week 47 and the first week above 1.7 times September baseline. In 5,000 US 2022/23 pairs, median distance from each pair\'s optimum is six weeks for the fixed date and two for the threshold. Pooled retained modeled benefit is 74.7 and 96.8 percent of the sum of per-draw optima. The first 50 curves are shown. Burgundy dots mark optima, teal rings threshold dates. This is a retrospective latent-curve simulation; the six weeks describes the dose-date gap, not an estimated peak shift.',
        `The same frozen national rules are applied to each state's own September baseline and 2022/23 epidemic draws. Texas, California, Minnesota, and New York were selected before results were calculated. Each state uses the same 5,000 VE and timing-shift draws as the national comparison; each state/draw has its own optimum. The first 50 curves are shown per state. ${statements} These are retrospective full-season latent curves, not an as-of-date evaluation or a geographic holdout.`
      ][stage];
      $('chart-title').textContent=stage===3?'The frozen national rule applied to four states in 2022–23':'The early 2022–23 US season';
      $('chart-desc').textContent=desc; $('status').textContent=desc;
    }
    buttons.forEach((id,i)=>$(id).addEventListener('click',()=>setStage(i+1)));
    $('reset').addEventListener('click',()=>setStage(1,false));
    document.addEventListener('keydown',event=>{
      if(event.repeat||(event.target.tagName==='BUTTON'&&event.key===' ')) return;
      if(['ArrowRight','PageDown',' ','ArrowLeft','PageUp','Home'].includes(event.key)) {
        event.preventDefault();
        const next=event.key==='Home'?1:['ArrowLeft','PageUp'].includes(event.key)?Math.max(1,stage-1):Math.min(3,stage+1);
        if(next!==stage) setStage(next);
      }
    });
    function fit() { document.documentElement.style.setProperty('--scale',Math.min(innerWidth/1280,innerHeight/720)); }
    addEventListener('resize',fit); fit();
    const hash=new URLSearchParams(location.hash.slice(1));
    setStage(Math.max(1,Math.min(3,Math.floor(Number(hash.get('state'))||1))),false);
  </script>
</body>
</html>
