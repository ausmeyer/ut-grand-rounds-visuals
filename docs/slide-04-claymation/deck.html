<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Clay patient journey · deck player</title>
<!-- Full-slide (1280x720) player for the Slides.com deck: starts just before the film begins moving,
     jumps to each surveillance system, and passes clicker keys back to the deck. -->
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}
body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
.stage{position:absolute;left:50%;top:50%;width:1280px;height:720px;margin:-360px 0 0 -640px;transform-origin:center}
.film{position:absolute;left:64px;top:12px;width:1152px;height:648px;border-radius:14px;overflow:hidden;background:#ded5c6;box-shadow:0 12px 42px rgba(41,57,55,.11)}
video{display:block;width:100%;height:100%;object-fit:cover}
nav{position:absolute;left:0;top:670px;width:1280px;height:38px;display:flex;justify-content:center;gap:7px}
button{display:flex;align-items:center;gap:7px;height:38px;padding:0 11px;box-sizing:border-box;border:1px solid #d7ddd4;border-radius:10px;background:#fffcf5;color:#203a3f;font-family:inherit;font-size:13px;font-weight:600;line-height:1;white-space:nowrap;cursor:pointer;transition:background-color .2s,border-color .2s}
button span{font-size:10.5px;font-weight:650;color:#69847c}
button small{font-size:11px;font-weight:500;color:#6f7d79}
button:hover,button.active{border-color:#246d70;background:#e3eee6}
button:focus{outline:none}
</style></head><body><div class="stage">
<div class="film"><video id="film" muted playsinline preload="auto" aria-label="Following influenza through U.S. surveillance" poster="poster.png?v=2b57690518cb" src="surveillance_claymation.mp4?v=2b57690518cb"></video></div>
<nav aria-label="Jump to a surveillance system"><button type="button" data-start="5.8">↺ Start</button><button type="button" data-start="14"><span>01</span>ILINet<small>0:14</small></button><button type="button" data-start="30"><span>02</span>NSSP<small>0:30</small></button><button type="button" data-start="50"><span>03</span>FluSurv-NET<small>0:50</small></button><button type="button" data-start="58"><span>04</span>NHSN<small>0:58</small></button><button type="button" data-start="74"><span>05</span>ICLS<small>1:14</small></button><button type="button" data-start="82"><span>06</span>NREVSS<small>1:22</small></button><button type="button" data-start="104"><span>07</span>NCHS<small>1:44</small></button><button type="button" data-start="112"><span>08</span>Pediatric deaths<small>1:52</small></button></nav>
</div><script>
const video = document.querySelector('#film');
const buttons = [...document.querySelectorAll('[data-start]')];
const START = 5.8;             // the film holds a still frame for its first 6 s
const OVERVIEW = 124;          // closing community overview: no chapter highlighted
const starts = buttons.map(b => Number(b.dataset.start));
const embedded = window.parent !== window;

function playFrom(t) {
  const go = () => { video.currentTime = t; video.play().catch(() => {}); };
  if (video.readyState > 0) go(); else video.addEventListener('loadedmetadata', go, { once: true });
}
function highlight() {
  const t = video.currentTime;
  let k = -1;
  starts.forEach((s, i) => { if (t >= s - 0.05) k = i; });
  if (t >= OVERVIEW - 0.05) k = -1;
  buttons.forEach((b, i) => b.classList.toggle('active', i === k));
}
function fit() {  // standalone viewing only; in the deck the frame is always 1280x720
  const s = Math.min(innerWidth / 1280, innerHeight / 720);
  if (s > 0) document.querySelector('.stage').style.transform = `scale(${s})`;
}

buttons.forEach(b => b.addEventListener('click', () => { playFrom(Number(b.dataset.start)); b.blur(); }));
video.addEventListener('timeupdate', highlight);
video.addEventListener('seeked', highlight);
video.addEventListener('loadedmetadata', () => { if (video.paused) video.currentTime = START; }, { once: true });
if (!embedded) { addEventListener('resize', fit); fit(); }

// Slides.com (reveal.js) posts slide:start / slide:stop to iframes on the visible slide. The deck preloads
// this frame a few slides ahead, so slide:start arrives on entry; after a direct jump from far away it can
// arrive before the page loads (the frame cannot tell it is on screen), and the Start button covers that.
addEventListener('message', e => {
  if (e.data === 'slide:start') playFrom(START);
  else if (e.data === 'slide:stop') video.pause();
});

// After a button click the keyboard focus is inside this frame; hand clicker keys back to the deck.
const deckKeys = { PageDown: 'next', PageUp: 'prev', ' ': 'next', n: 'next', N: 'next', p: 'prev', P: 'prev',
  ArrowRight: 'right', ArrowLeft: 'left', ArrowDown: 'down', ArrowUp: 'up',
  b: 'togglePause', B: 'togglePause', '.': 'togglePause', o: 'toggleOverview', O: 'toggleOverview', Escape: 'toggleOverview' };
addEventListener('keydown', e => {
  const method = deckKeys[e.key];
  if (!method || !embedded) return;
  e.preventDefault();
  window.parent.postMessage(JSON.stringify({ method, args: [] }), '*');
});

if (!embedded) playFrom(START);
</script></body></html>
