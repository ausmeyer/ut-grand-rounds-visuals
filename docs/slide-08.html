<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <meta name="color-scheme" content="light">
  <title>Influenza surveillance system</title>
  <style>
    :root {
      --ink: #14242b;
      --muted: #647278;
      --paper: #fbfaf6;
      --panel: #f1eee6;
      --grid: #d9dedb;
      --line: #8b9699;
      --accent: #2677a8;
      --accent-open: #dfeef5;
    }

    * { box-sizing: border-box; }
    html, body { width: 1240px; height: 540px; margin: 0; overflow: hidden; }
    body {
      background: var(--paper);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-variant-numeric: tabular-nums;
    }
    button, select { font: inherit; }

    .app {
      display: grid;
      grid-template-rows: 38px minmax(0, 1fr);
      gap: 8px;
      width: 1240px;
      height: 540px;
      padding: 10px 16px 8px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
    }
    .eyebrow {
      color: var(--accent);
      font-size: 12px;
      font-weight: 840;
      letter-spacing: .12em;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .state-controls { display: flex; align-items: center; gap: 7px; }
    .state-controls label {
      margin-right: 2px;
      color: var(--muted);
      font-size: 10.5px;
      font-weight: 800;
      letter-spacing: .07em;
      text-transform: uppercase;
    }
    select, button {
      height: 32px;
      border: 1px solid #b9c3c0;
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
      font-weight: 740;
    }
    select { width: 252px; padding: 0 34px 0 10px; font-size: 13px; }
    button { width: 34px; padding: 0; font-size: 17px; cursor: pointer; }
    button:hover { border-color: var(--accent); color: var(--accent); }
    button:disabled { cursor: default; opacity: .35; }
    button:focus-visible, select:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 24%, transparent); outline-offset: 2px; }

    .content {
      display: grid;
      grid-template-columns: 270px 1fr;
      min-height: 0;
      overflow: hidden;
      border: 1px solid #d5dad6;
      border-radius: 14px;
      background: #fff;
      box-shadow: 0 8px 24px rgb(28 49 50 / 7%);
    }

    .identity {
      display: grid;
      grid-template-rows: 144px auto auto 1fr auto;
      gap: 7px;
      min-height: 0;
      border-right: 1px solid #d8ddd9;
      padding: 14px 16px 12px;
      background: var(--panel);
    }
    .illustration {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 0;
    }
    .illustration img {
      display: block;
      width: 190px;
      height: 138px;
      object-fit: contain;
      filter: contrast(.94);
    }
    .system-name { margin: 0; font-size: 25px; line-height: 1; letter-spacing: -.035em; }
    .full-name { margin: 0; color: #47585f; font-size: 11.5px; font-weight: 650; line-height: 1.28; }
    .observation {
      margin: 2px 0 0;
      color: #2f4249;
      font-size: 13px;
      font-weight: 760;
      line-height: 1.3;
    }
    .facts { align-self: end; border-top: 1px solid #cfd6d2; }
    .fact {
      display: grid;
      grid-template-columns: 58px 1fr;
      gap: 7px;
      padding: 6px 0;
      border-bottom: 1px solid #d8ddd9;
    }
    .fact-label {
      color: var(--muted);
      font-size: 9px;
      font-weight: 840;
      letter-spacing: .075em;
      line-height: 1.25;
      text-transform: uppercase;
    }
    .fact-value { color: #34464d; font-size: 10.5px; font-weight: 670; line-height: 1.25; }
    .source-link { color: var(--accent); font-size: 10px; font-weight: 780; text-decoration: none; }
    .source-link:hover { text-decoration: underline; }

    .visual {
      display: grid;
      grid-template-rows: 58px minmax(0, 1fr) 67px;
      min-width: 0;
      min-height: 0;
      padding: 13px 16px 11px;
    }
    .chart-heading { min-width: 0; }
    .chart-heading h1 {
      margin: 0;
      font-size: 24px;
      line-height: 1.08;
      letter-spacing: -.03em;
      white-space: nowrap;
    }
    .chart-heading p { margin: 5px 0 0; color: var(--muted); font-size: 12px; font-weight: 650; }

    .chart-wrap { position: relative; min-width: 0; min-height: 0; }
    svg { display: block; width: 100%; height: 100%; overflow: visible; }
    .gridline { stroke: var(--grid); stroke-width: 1; }
    .axis-line { stroke: #879396; stroke-width: 1.25; }
    .axis-label { fill: var(--muted); font-size: 11px; font-weight: 680; }
    .axis-title { fill: var(--muted); font-size: 10.5px; font-weight: 790; letter-spacing: .02em; }
    .context-line, .geo-line, .focus-line, .focus-area { transition: opacity .22s ease; }
    .context-line { fill: none; stroke: #aab4b3; stroke-width: 1.4; opacity: .38; }
    .geo-line { fill: none; stroke: var(--accent); stroke-width: 1.25; opacity: .17; }
    .focus-line { fill: none; stroke: var(--accent); stroke-width: 3.4; stroke-linecap: round; stroke-linejoin: round; }
    .focus-area { fill: var(--accent-open); opacity: .72; }
    .focus-dot { fill: #fff; stroke: var(--accent); stroke-width: 2.5; }
    .focus-label { fill: var(--accent); font-size: 11px; font-weight: 840; paint-order: stroke; stroke: #fff; stroke-width: 4px; stroke-linejoin: round; }
    .timeline-line { stroke: #aeb9b6; stroke-width: 3; }
    .timeline-arrow { fill: #aeb9b6; }
    .timeline-node { fill: #fff; stroke: var(--accent); stroke-width: 4; }
    .timeline-year { fill: var(--accent); font-size: 25px; font-weight: 860; letter-spacing: -.03em; }
    .timeline-title { fill: var(--ink); font-size: 12.5px; font-weight: 830; }
    .timeline-copy { fill: var(--muted); font-size: 10.5px; font-weight: 670; }
    .timeline-takeaway { fill: color-mix(in srgb, var(--accent) 8%, #fff); stroke: color-mix(in srgb, var(--accent) 24%, #fff); }
    .timeline-takeaway-strong { fill: var(--ink); font-size: 13px; font-weight: 840; }
    .timeline-takeaway-copy { fill: #3c5057; font-size: 12px; font-weight: 700; }

    .reading-note {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 300px;
      gap: 18px;
      align-items: center;
      border-top: 1px solid #d8ddd9;
      padding-top: 9px;
    }
    .history-line { min-width: 0; }
    .history-kicker, .limit-kicker {
      margin-bottom: 3px;
      color: var(--muted);
      font-size: 9.5px;
      font-weight: 840;
      letter-spacing: .075em;
      text-transform: uppercase;
    }
    .history-copy { color: #34464d; font-size: 11px; font-weight: 700; line-height: 1.26; }
    .change-copy { color: var(--accent); }
    .limit {
      border-left: 3px solid var(--accent);
      padding-left: 10px;
      color: #34464d;
      font-size: 11px;
      font-weight: 650;
      line-height: 1.28;
    }
    .state-caption { color: var(--accent); }

    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="eyebrow" id="eyebrow">Surveillance system</div>
      <div class="state-controls">
        <label for="state-select">View</label>
        <button id="back-button" type="button" aria-label="Previous view">←</button>
        <select id="state-select" aria-label="Surveillance-system view">
          <option value="signal">1 · Observed signal</option>
          <option value="seasons">2 · Variation across seasons</option>
          <option value="geography">3 · Variation across locations</option>
          <option value="history" id="history-option" hidden>4 · How the signal changed</option>
        </select>
        <button id="next-button" type="button" aria-label="Next view">→</button>
      </div>
    </header>

    <section class="content">
      <aside class="identity">
        <div class="illustration"><img id="system-image" alt=""></div>
        <h2 class="system-name" id="system-name"></h2>
        <p class="full-name" id="full-name"></p>
        <div>
          <p class="observation" id="observation"></p>
          <div class="facts">
            <div class="fact"><div class="fact-label">Series</div><div class="fact-value" id="series-fact"></div></div>
            <div class="fact"><div class="fact-label">Coverage</div><div class="fact-value" id="coverage-fact"></div></div>
            <div class="fact"><div class="fact-label">Age</div><div class="fact-value" id="age-fact"></div></div>
            <div class="fact"><div class="fact-label">Cadence</div><div class="fact-value" id="timeliness-fact"></div></div>
          </div>
        </div>
        <a class="source-link" id="source-link" target="_blank" rel="noopener">CDC surveillance methods ↗</a>
      </aside>

      <section class="visual">
        <header class="chart-heading">
          <h1 id="question"></h1>
          <p id="chart-subtitle"></p>
        </header>
        <div class="chart-wrap">
          <svg id="chart" viewBox="0 0 900 320" role="img" aria-labelledby="chart-title chart-desc">
            <title id="chart-title">Seasonal influenza surveillance time series</title>
            <desc id="chart-desc">A line chart that can show one selected season, historical seasons, or locations.</desc>
          </svg>
        </div>
        <footer class="reading-note">
          <div class="history-line">
            <div class="history-kicker">History and comparability</div>
            <div class="history-copy"><span id="network-since"></span><br><span class="change-copy" id="change-copy"></span></div>
          </div>
          <div class="limit"><div class="limit-kicker">Principal limitation</div><span id="limitation"></span></div>
        </footer>
      </section>
    </section>
  </main>

      } else {
        curves = data.geography;
        subtitle = `${config.focusSeason} · ${data.summary.locationCount} reporting locations in this extract · ${config.geoHighlight} highlighted`;
      }
      document.getElementById("chart-subtitle").textContent = subtitle;

      const values = curves.flatMap((curve) => curve.points.map((point) => point[1]));
      if (state === "geography" && config.mainLocation !== config.geoHighlight) {
        values.push(...data.focus.points.map((point) => point[1]));
      }
      const yMax = niceMax(Math.max(...values) * 1.04);
      const xScale = (x) => bounds.left + ((x - 1) / 39) * (bounds.right - bounds.left);
      const yScale = (y) => bounds.bottom - (y / yMax) * (bounds.bottom - bounds.top);

      for (let i = 0; i <= 4; i += 1) {
        const value = (yMax / 4) * i;
        const y = yScale(value);
        chart.appendChild(element("line", { x1: bounds.left, x2: bounds.right, y1: y, y2: y, class: "gridline" }));
        chart.appendChild(element("text", { x: bounds.left - 10, y: y + 4, class: "axis-label", "text-anchor": "end" }, Number.isInteger(value) ? value.toString() : value.toFixed(1)));
      }
      monthTicks.forEach(([week, label]) => {
        const x = xScale(week);
        chart.appendChild(element("line", { x1: x, x2: x, y1: bounds.top, y2: bounds.bottom, class: "gridline", opacity: ".45" }));
        chart.appendChild(element("text", { x, y: 300, class: "axis-label", "text-anchor": "middle" }, label));
      });
      chart.appendChild(element("line", { x1: bounds.left, x2: bounds.right, y1: bounds.bottom, y2: bounds.bottom, class: "axis-line" }));
      chart.appendChild(element("line", { x1: bounds.left, x2: bounds.left, y1: bounds.top, y2: bounds.bottom, class: "axis-line" }));
      chart.appendChild(element("text", { x: 13, y: 148, class: "axis-title", transform: "rotate(-90 13 148)", "text-anchor": "middle" }, config.unit));

      let focusCurve = data.focus;
      if (state === "seasons") {
        curves.filter((curve) => curve.season !== config.focusSeason).forEach((curve) => {
          chart.appendChild(element("path", { d: pathFor(curve.points, xScale, yScale), class: "context-line" }));
        });
      } else if (state === "geography") {
        curves.filter((curve) => curve.location !== config.geoHighlight).forEach((curve) => {
          chart.appendChild(element("path", { d: pathFor(curve.points, xScale, yScale), class: "geo-line" }));
        });
        focusCurve = curves.find((curve) => curve.location === config.geoHighlight) || data.focus;
      }

      if (state === "signal") {
        chart.appendChild(element("path", { d: pathFor(focusCurve.points, xScale, yScale, true), class: "focus-area" }));
      }
      chart.appendChild(element("path", { d: pathFor(focusCurve.points, xScale, yScale), class: "focus-line" }));
      const peak = focusCurve.points.reduce((best, point) => point[1] > best[1] ? point : best, focusCurve.points[0]);
      chart.appendChild(element("circle", { cx: xScale(peak[0]), cy: yScale(peak[1]), r: 4.7, class: "focus-dot" }));
      const label = state === "geography" ? config.geoHighlight : (state === "seasons" ? config.focusSeason : config.mainLocation);
      chart.appendChild(element("text", {
        x: xScale(peak[0]) + 8,
        y: Math.max(bounds.top + 12, yScale(peak[1]) - 8),
        class: "focus-label",
      }, label));
    }

    function writeHash(state) {
      history.replaceState(null, "", `#state=${state}`);
    }

    function setState(state, updateHash = true) {
      if (!states.includes(state)) state = "signal";
      stateSelect.value = state;
      const index = states.indexOf(state);
      backButton.disabled = index === 0;
      nextButton.disabled = index === states.length - 1;
      render(state);
      if (updateHash) writeHash(state);
    }

    stateSelect.addEventListener("change", () => setState(stateSelect.value));
    backButton.addEventListener("click", () => setState(states[Math.max(0, states.indexOf(stateSelect.value) - 1)]));
    nextButton.addEventListener("click", () => setState(states[Math.min(states.length - 1, states.indexOf(stateSelect.value) + 1)]));
    window.addEventListener("keydown", (event) => {
      if (event.key === "ArrowLeft") backButton.click();
      if (event.key === "ArrowRight") nextButton.click();
    });
    window.addEventListener("hashchange", () => {
      const state = new URLSearchParams(location.hash.slice(1)).get("state");
      setState(state, false);
    });

    const initial = new URLSearchParams(location.hash.slice(1)).get("state") || "signal";
    setState(initial, false);
  </script>
</body>
</html>
