    * { box-sizing: border-box; }
    html, body { width: 1240px; height: 540px; margin: 0; overflow: hidden; }
    body { background: var(--paper); color: var(--ink); font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-variant-numeric: tabular-nums; }
    .app { width: 1240px; height: 540px; display: grid; grid-template-rows: 38px 1fr; gap: 8px; padding: 10px 16px 8px; }
    .topbar, .controls { display: flex; align-items: center; }
    .topbar { justify-content: space-between; gap: 16px; }
    .subtitle { color: #42535a; font-size: 16px; font-weight: 670; }
    .controls { gap: 7px; }
    .controls label { color: var(--muted); font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .07em; margin-right: 3px; }
    button, select { height: 32px; border: 1px solid #b9c3c0; border-radius: 8px; background: white; color: var(--ink); font: inherit; font-weight: 740; }
    select { width: 270px; padding: 0 32px 0 10px; font-size: 13px; }
    button { width: 34px; padding: 0; font-size: 17px; cursor: pointer; }
    button:hover { border-color: var(--teal); color: var(--teal); }
    button:disabled { opacity: .35; cursor: default; }
    :focus-visible { outline: 3px solid #82bcc1; outline-offset: 2px; }
    .frame { padding: 8px 12px; border: 1px solid var(--line); border-radius: 14px; background: white; box-shadow: 0 8px 24px rgb(28 49 50 / 7%); }
    #chart { display: block; width: 1182px; height: 458px; }
    svg text { fill: var(--ink); font-size: 17px; }
    .tick { fill: var(--muted); font-size: 16px; }
    .panel-label { font-size: 18px; font-weight: 720; }
    .unit { fill: var(--muted); font-size: 14px; }
    .view { opacity: 0; visibility: hidden; }
    .view.active { opacity: 1; visibility: visible; }
    body[data-ready] .view { transition: opacity 450ms ease, visibility 450ms; }
    @media (prefers-reduced-motion: reduce) { body[data-ready] .view { transition: none; } }
  </style>
</head>

      add(calendar, 'text', {x: x(value), y: 451, class: 'tick', 'text-anchor': anchor}, date.getUTCFullYear());
    });
    function fromHash() {
      const state = new URLSearchParams(location.hash.slice(1)).get('state');
      return ['1', '2', '3'].includes(state) ? Number(state) : 1;
    }
    function render() {
      const state = fromHash(); document.body.dataset.state = String(state);
      select.value = String(state); back.disabled = state === 1; next.disabled = state === 3;
      for (const view of document.querySelectorAll('.view')) {
        const active = view.id === `view-${state}`;
        view.classList.toggle('active', active); view.setAttribute('aria-hidden', String(!active));
      }
      document.getElementById('chart-desc').textContent = `Signals from ${data.start} to ${data.end}, sharing calendar dates with independently labeled scales. Texas hospital admissions; national NSSP influenza and RSV percentages of emergency department visits; national WastewaterSCAN influenza A, median across site-week median log10 PMMoV-normalized concentrations with a 0.00001 pseudocount. Displayed NSSP curves use the latest retained issue for each week, not the values available at each historical forecast origin. Wastewater uses a revised snapshot. No curves are shifted or interpolated, and no predictive improvement is asserted. View ${state} shows ${[1, 3, 4][state - 1]} signals.`;
    }
    function go(state) { location.hash = `state=${Math.max(1, Math.min(3, state))}`; }
    select.addEventListener('change', () => go(Number(select.value)));
    back.addEventListener('click', () => go(fromHash() - 1)); next.addEventListener('click', () => go(fromHash() + 1));
    addEventListener('hashchange', render);
    addEventListener('keydown', event => {
      if (['SELECT', 'INPUT', 'BUTTON', 'A'].includes(document.activeElement.tagName)) return;
      if (event.key === 'ArrowRight' || event.key === 'ArrowLeft') { event.preventDefault(); go(fromHash() + (event.key === 'ArrowRight' ? 1 : -1)); }
    });
    render(); requestAnimationFrame(() => requestAnimationFrame(() => { document.body.dataset.ready = 'true'; }));
  </script>
</body>
</html>
