<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>FluSight forecast targets</title>
  <style>
    :root { --ink: #14242b; --muted: #647278; --teal: #0a6670; --paper: #fbfaf6; --line: #d5dad6; }
    * { box-sizing: border-box; }
    html, body { width: 1240px; height: 540px; margin: 0; overflow: hidden; }
    body { background: var(--paper); color: var(--ink); font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .app { width: 1240px; height: 540px; display: grid; grid-template-rows: 38px 1fr; gap: 8px; padding: 10px 16px 8px; }
    .topbar, .controls { display: flex; align-items: center; }
    .topbar { justify-content: space-between; gap: 16px; }
    .subtitle { color: #42535a; font-size: 14px; font-weight: 670; }
    .controls { gap: 7px; }
    .controls label { color: var(--muted); font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .07em; margin-right: 3px; }
    button, select { height: 32px; border: 1px solid #b9c3c0; border-radius: 8px; background: white; color: var(--ink); font: inherit; font-weight: 740; }
    select { width: 252px; padding: 0 32px 0 10px; font-size: 13px; }
    button { width: 34px; padding: 0; font-size: 17px; cursor: pointer; }
    button:hover { border-color: var(--teal); color: var(--teal); }
    button:disabled { opacity: .35; cursor: default; }
    :focus-visible { outline: 3px solid #82bcc1; outline-offset: 2px; }
    .frame { position: relative; border: 1px solid var(--line); border-radius: 14px; background: white; box-shadow: 0 8px 24px rgb(28 49 50 / 7%); }
    .history { position: absolute; top: 25px; left: 150px; right: 150px; height: 87px; display: grid; grid-template-columns: 1fr 100px 1fr; align-items: center; text-align: center; }
    .year { font-size: 15px; font-weight: 700; color: var(--muted); margin-bottom: 8px; }
    .event { font-size: 23px; font-weight: 720; }
    .arrow { color: #8caaa9; font-size: 42px; }
    .primary { position: absolute; top: 161px; left: 80px; right: 80px; text-align: center; }
    .tag { color: var(--teal); font-size: 14px; font-weight: 800; letter-spacing: .09em; text-transform: uppercase; }
    .target-name { margin: 12px 0 9px; font-size: 42px; line-height: 1.2; font-weight: 780; color: var(--teal); }
    .horizon { color: #536a72; font-size: 21px; }
    .other-targets { position: absolute; top: 352px; left: 54px; right: 54px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 25px; text-align: center; }
    .other-target { color: #425961; font-size: 20px; line-height: 1.35; font-weight: 680; }
    .target-detail { display: block; margin-top: 8px; color: var(--muted); font-size: 16px; font-weight: 500; }
    .frame[data-state="1"] .history { top: 170px; }
    .frame[data-state="1"] .event { font-size: 30px; }
    .frame[data-state="1"] .year { font-size: 20px; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="subtitle">From outpatient illness to hospital burden</div>
      <div class="controls"><label for="state-select">View</label><button id="back-button" aria-label="Previous view">←</button><select id="state-select" aria-label="Forecast targets view"><option value="1">1 · Changing targets</option><option value="2">2 · Weekly admissions</option><option value="3">3 · Other targets</option></select><button id="next-button" aria-label="Next view">→</button></div>
    </header>
    <section class="frame" data-state="1" aria-label="FluSight history and targets">
      <div class="history"><div><div class="year">2013–14</div><div class="event">Outpatient illness</div></div><div class="arrow" aria-label="to">→</div><div><div class="year">2021–22 onward</div><div class="event">Hospital admissions</div></div></div>
      <section class="primary" data-step="2" hidden aria-label="Primary forecast target">
        <div class="tag"><span id="target-season"></span> · Primary target</div>
        <div class="target-name">Weekly hospital admissions</div>
        <div class="horizon">Current week + 3 weeks ahead</div>
      </section>
      <section class="other-targets" data-step="3" hidden aria-label="Other forecast targets">
        <div class="other-target">Influenza share of<br>emergency visits</div>
        <div class="other-target">Categorical<br>admission changes<span class="target-detail">Increase / decrease</span></div>
        <div class="other-target">Peak timing</div>
        <div class="other-target">Peak admissions</div>
      </section>
    </section>
  </main>
  <script>
    "use strict";
    const data = {"target_season":"2026–27"};
    document.getElementById("target-season").textContent = data.target_season;
    const select = document.getElementById("state-select"), back = document.getElementById("back-button"), next = document.getElementById("next-button");
    function fromHash() { const value = Number(new URLSearchParams(location.hash.slice(1)).get("state")); return [1, 2, 3].includes(value) ? value : 1; }
    function render() {
      const step = fromHash(); select.value = String(step); back.disabled = step === 1; next.disabled = step === 3;
      document.querySelector(".frame").dataset.state = step;
      document.querySelectorAll("[data-step]").forEach(el => { el.hidden = Number(el.dataset.step) > step; });
    }
    function go(value) { location.hash = `state=${Math.max(1, Math.min(3, value))}`; }
    select.addEventListener("change", () => go(Number(select.value)));
    back.addEventListener("click", () => go(fromHash() - 1)); next.addEventListener("click", () => go(fromHash() + 1));
    addEventListener("hashchange", render);
    addEventListener("keydown", event => { if (["SELECT", "INPUT", "BUTTON"].includes(document.activeElement.tagName)) return; if (event.key === "ArrowRight" || event.key === "ArrowLeft") { event.preventDefault(); go(fromHash() + (event.key === "ArrowRight" ? 1 : -1)); } });
    render();
  </script>
</body>
</html>
