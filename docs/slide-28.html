    const $ = id => document.getElementById(id);
    const NS = 'http://www.w3.org/2000/svg';
    const X = week => 80 + week / 28 * 472, Y = protection => 410 - protection / .6 * 298;
    const calendarX = week => 880 + (week - 40) / 9 * 267;
    const buttons = ['start','primary','alternative','sustained'];
    const reducedMotion = matchMedia('(prefers-reduced-motion:reduce)').matches;
    let stage = 1, animation = 0;
    function element(tag,attrs,parent,text) {
      const el=document.createElementNS(NS,tag);
      for(const [key,value] of Object.entries(attrs)) el.setAttribute(key,value);
      if(text!==undefined) el.textContent=text;
      parent.appendChild(el); return el;
    }
    for(const value of [0,.2,.4,.6]) {
      element('line',{x1:X(0),x2:X(28),y1:Y(value),y2:Y(value),class:'grid'},$('axes'));
      element('text',{x:X(0)-14,y:Y(value)+6,'text-anchor':'end',class:'axis'},$('axes'),`${Math.round(value*100)}%`);
    }
    for(let week=0;week<=28;week+=4) element('text',{x:X(week),y:436,'text-anchor':'middle',class:'axis'},$('axes'),week);
    element('text',{x:316,y:467,'text-anchor':'middle',class:'axis'},$('axes'),'Weeks after vaccination');
    for(const [week,month] of [[40,'Oct'],[44,'Nov'],[48,'Dec']]) {
      element('line',{x1:calendarX(week),x2:calendarX(week),y1:112,y2:438,class:'grid'},$('calendar'));
      element('text',{x:calendarX(week),y:91,'text-anchor':'middle',class:'axis'},$('calendar'),month);
    }
    const models=DATA.models.map((model,i)=>{
      const clip=element('clipPath',{id:`clip-${i}`},$('clips'));
      const clipRect=element('rect',{x:76,y:106,width:480,height:309},clip);
      const curve=element('path',{d:model.mean_protection.map((value,j)=>`${j?'L':'M'}${X(DATA.weeks_after_vaccination[j]).toFixed(2)},${Y(value).toFixed(2)}`).join(' '),fill:'none',stroke:model.color,'stroke-width':4,'stroke-linejoin':'round','clip-path':`url(#clip-${i})`},$('curves'));
      if(model.hypothetical) curve.setAttribute('stroke-dasharray','9 6');
      const y=171+i*112;
      element('line',{x1:calendarX(40),x2:calendarX(49),y1:y,y2:y,class:'grid'},$('calendar'));
      const label=element('g',{},$('calendar'));
      element('text',{x:650,y:y+(model.hypothetical?-6:7),'font-size':21,'font-weight':600,style:`fill:${model.color}`},label,model.label);
      if(model.hypothetical) element('text',{x:650,y:y+22,'font-size':16,style:`fill:${model.color}`},label,'Hypothetical');
      const result=element('g',{},$('calendar'));
      element('circle',{cx:calendarX(model.selected_week),cy:y,r:7,fill:model.color},result);
      element('text',{x:calendarX(model.selected_week)+15,y:y+7,'font-size':21,'font-weight':650,style:`fill:${model.color}`},result,`Week ${model.selected_week}`);
      return {curve,clipRect,label,result};
    });
    function setStage(value,play=true) {
      const previous=stage;
      cancelAnimationFrame(animation); stage=value; document.body.dataset.state=value;
      history.replaceState(null,'',`#state=${value}`);
      buttons.forEach((id,i)=>$(id).setAttribute('aria-pressed',value===i+1));
      models.forEach((model,i)=>{
        model.curve.style.display=i<value-1?'':'none'; model.result.style.display=i<value-1?'':'none';
        model.label.style.opacity=i<value-1?1:.28; model.result.style.opacity=1;
        model.clipRect.setAttribute('width',480);
      });
      $('takeaway').style.display=value===4?'':'none';
      if(play&&value>previous&&value>1&&!reducedMotion) {
        const model=models[value-2], start=performance.now();
        model.clipRect.setAttribute('width',0); model.result.style.opacity=0;
        function frame(now) {
          const progress=Math.max(0,Math.min(1,(now-start)/1000));
          model.clipRect.setAttribute('width',480*progress); model.result.style.opacity=progress;
          if(progress<1) animation=requestAnimationFrame(frame);
        }
        animation=requestAnimationFrame(frame);
      }
      $('chart-desc').textContent='Mean bounded protection across 5,000 saved draws per waning model. Selected weeks come from each full national all-age decision analysis. '+(value===1?'Advance to compare the models.':DATA.models.slice(0,value-1).map(model=>`${model.label}${model.hypothetical?' (hypothetical)':''}: week ${model.selected_week}.`).join(' '));
      $('status').textContent=$('chart-desc').textContent;
    }
    buttons.forEach((id,i)=>$(id).addEventListener('click',()=>setStage(i+1)));
    $('reset').addEventListener('click',()=>setStage(1,false));
    document.addEventListener('keydown',event=>{
      if(event.repeat||(event.target.tagName==='BUTTON'&&event.key===' ')) return;
      if(['ArrowRight','PageDown',' ','ArrowLeft','PageUp','Home'].includes(event.key)) {
        event.preventDefault(); setStage(event.key==='Home'?1:['ArrowLeft','PageUp'].includes(event.key)?Math.max(1,stage-1):Math.min(4,stage+1));
      }
    });
    function fit() { document.documentElement.style.setProperty('--scale',Math.min(innerWidth/1280,innerHeight/720)); }
    addEventListener('resize',fit); fit();
    const hash=new URLSearchParams(location.hash.slice(1));
    setStage(Math.max(1,Math.min(4,Math.floor(Number(hash.get('state'))||1))),false);
