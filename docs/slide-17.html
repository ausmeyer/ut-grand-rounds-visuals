    .subtitle { color: #42535a; font-size: 16px; font-weight: 670; }

    button { width: 34px; padding: 0; font-size: 17px; cursor: pointer; }
    button:hover { border-color: var(--teal); color: var(--teal); }
    button:disabled { opacity: .35; cursor: default; }
    :focus-visible { outline: 3px solid #82bcc1; outline-offset: 2px; }
    .frame { padding: 17px 24px; border: 1px solid var(--line); border-radius: 14px; background: white; box-shadow: 0 8px 24px rgb(28 49 50 / 7%); }
    #chart { display: block; width: 1158px; height: 438px; }
    svg { font-size: 18px; }
    svg text { fill: var(--ink); }
    .tick { fill: var(--muted); font-size: 16px; }
    .reconstructed-label { fill: var(--teal); font-size: 20px; font-weight: 670; }
    .observed-label { fill: #58666c; font-size: 20px; font-weight: 670; }
    .takeaway { font-size: 23px; font-weight: 700; }
    .citation { fill: var(--muted); font-size: 14px; }
    a:hover .citation { fill: var(--teal); text-decoration: underline; }
    .reveal { opacity: 0; visibility: hidden; }
    body[data-state="2"] .reveal, body[data-state="3"] .reveal { opacity: 1; visibility: visible; }
    #reconstructed-shift { transform: translateX(0); }
    body[data-state="3"] #reconstructed-shift { transform: translateX(var(--shift-x)); }
    #observed-early { opacity: 1; visibility: visible; }
    body[data-state="3"] #observed-early { opacity: 0; visibility: hidden; }
    #stitch-join { opacity: 0; visibility: hidden; }
    body[data-state="3"] #stitch-join { opacity: 1; visibility: visible; }
    body[data-ready] .reveal { transition: opacity 400ms ease, visibility 400ms; }
    body[data-ready] #observed-early { transition: opacity 300ms ease, visibility 300ms; }
    body[data-ready] #reconstructed-shift { transition: transform 1400ms cubic-bezier(.22,.61,.36,1); }
    body[data-ready][data-state="3"] #reconstructed-shift { transition-delay: 350ms; }
    body[data-ready][data-state="3"] #stitch-join { transition: opacity 150ms 1750ms, visibility 0s 1750ms; }
