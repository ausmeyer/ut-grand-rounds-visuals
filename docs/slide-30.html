    function revealThreshold(progress) {
      $('threshold-markers').style.opacity=progress;
      $('threshold-comparison').style.opacity=progress;
      $('threshold-view').dataset.progress=progress;
    }
    function alignSeasons(progress) {
      alignmentGraphics.forEach((group,i)=>group.setAttribute('transform',`translate(${AX(progress*alignment.profiles[i].shift)-AX(0)} 0)`));
      $('alignment-view').dataset.progress=progress;
      for(const id of ['alignment-band','alignment-mean','alignment-summary']) $(id).style.display=progress===1?'':'none';
    }
    function samples(count,active=-1,showDates=true) {
      graphics.forEach((graphic,i)=>{
        const selected=i===active;
        graphic.curves.forEach((curve,panel)=>{
          curve.style.opacity='';
          curve.style.display=i<count&&(panel<2||showDates)?'':'none';
          curve.setAttribute('stroke',panel===0?(selected?'#647b7d':'#a4b0b0'):(selected?'#0a6670':'#7b9e9a'));
          curve.setAttribute('stroke-width',selected?2.6:1.1); curve.setAttribute('opacity',selected?1:[.35,.23,.35][panel]);
        });
        graphic.markers.forEach(mark=>{
          mark.style.display=i<count&&showDates?'':'none'; mark.style.opacity=selected?1:.5; mark.setAttribute('r',selected?5.5:3.4);
        });
      });
      $('season-label').textContent=active>=0?DATA.scenarios[active].season:'';
      $('sample-count').textContent=`${count} of ${DATA.n_draws.toLocaleString('en-US')} pre-pandemic pairs`;
    }
    function animate(duration,tick,done=()=>{}) {
      const start=performance.now();
      function frame(now) {
        const p=Math.max(0,Math.min(1,(now-start)/duration)); tick(p);
        if(p<1) animation=requestAnimationFrame(frame); else done();
      }
      animation=requestAnimationFrame(frame);
    }
    function setStage(value,play=true) {
      const previous=stage;
      cancelAnimationFrame(animation); stage=Math.max(1,Math.min(5,Math.floor(value))); value=stage;
      document.body.dataset.state=value; history.replaceState(null,'',`#state=${value}`);
      buttons.forEach((id,i)=>$(id).setAttribute('aria-pressed',value===i+1));
      $('scenario-view').style.display=value>=4?'none':'';
      $('alignment-view').style.display=value===4?'':'none';
      $('threshold-view').style.display=value===5?'':'none';
      $('alignment-view').style.opacity=1; $('threshold-view').style.opacity=1;
      $('chart-title').textContent=value===5?'A pre-pandemic threshold tested on 5,000 later-season pairs':value===4?'Optimal dates after aligning epidemic curves':'Each scenario has its own best vaccination date';
      if(value===1) samples(1,0,false);
      else if(value===2) {
        samples(1,0);
        if(play&&value>previous&&!reducedMotion) {
          const reveal=[graphics[0].curves[2],...graphics[0].markers]; reveal.forEach(el=>el.style.opacity=0);
          animate(600,p=>reveal.forEach(el=>el.style.opacity=p));
        }
      } else if(value===3) {
        if(play&&value>previous&&!reducedMotion) {
          samples(1,0);
          let shown=1;
          animate(8000,p=>{const count=Math.min(graphics.length,1+Math.floor(p*graphics.length)); if(count!==shown) { samples(count,count-1); shown=count; }},()=>{
            samples(graphics.length);
          });
        } else { samples(graphics.length); }
      } else if(value===4) {
        $('sample-count').textContent='Pre-pandemic seasons · 2011–19';
        if(play&&value>previous&&!reducedMotion) {
          alignSeasons(0); animate(1800,p=>alignSeasons(p*p*(3-2*p)));
        } else alignSeasons(1);
      } else {
        $('sample-count').textContent='50 of 5,000 later-season pairs · 2023–26';
        if(play&&value>previous&&!reducedMotion) {
          revealThreshold(0);
          if(previous===4) {
            $('alignment-view').style.display=''; $('threshold-view').style.opacity=0;
            animate(1400,p=>{
              const incoming=Math.max(0,Math.min(1,(p-.2)/.65));
              $('alignment-view').style.opacity=1-Math.min(1,p/.65);
              $('threshold-view').style.opacity=incoming*incoming*(3-2*incoming);
              revealThreshold(Math.max(0,Math.min(1,(p-.55)/.45)));
            },()=>{$('alignment-view').style.display='none';revealThreshold(1);});
          } else animate(700,revealThreshold);
        } else revealThreshold(1);
      }
      const desc=[
        '',
        'One pre-pandemic epidemic and vaccine-protection pair. Advance to reveal its best vaccination date.',
        `The regret curve reaches its calculated minimum at week ${DATA.scenarios[0].best_week}. Red dots mark that same dose date on the epidemic and calendar-aligned protection curves. Protection begins after the saved immune-response delay.`,
        `${DATA.scenarios.length} pre-pandemic pairs appear in sequence, each with a calculated regret minimum and matching dose-date dots. They are the first 50 of 5,000 seeded draws from 2011/12 through 2018/19, with pre-pandemic VE estimates.`,
        `These 50 pre-pandemic curves are shifted by maximum shared area after AUC normalization. Displayed heights are divided by each draw's September baseline. Red optimal dates move with their curves and are not used to choose the shifts. Across all 5,000 training pairs, median activity at the optimal date gives a frozen threshold of ${multiplier.toFixed(1)} times baseline. The pale band is the middle half of the 50 aligned optimal dates.`,
        `Apply the frozen ${multiplier.toFixed(1)}-times-September-baseline rule and fixed week ${threshold.fit.fixed_week} to ${threshold.evaluation_n.toLocaleString()} pairs from 2023/24 through 2025/26. The first 50 are shown. Gray curves are post-pandemic latent epidemic draws; burgundy dots are their individual optima, and teal rings are the first eligible weeks above the threshold. Median absolute timing gaps are ${threshold.summary.fixed.median_absolute_weeks} wk for the fixed date and ${threshold.summary.threshold.median_absolute_weeks} wk for the threshold. Pooled retained modeled protection is ${((1-threshold.summary.fixed.pooled_relative_loss)*100).toFixed(1)} percent and ${((1-threshold.summary.threshold.pooled_relative_loss)*100).toFixed(1)} percent, respectively, relative to the sum of each draw's optimum. All ${threshold.evaluation_n.toLocaleString()} cross the threshold. This is a retrospective simulation using revised-data latent curves, not a real-time surveillance evaluation or a validated clinical recommendation.`
      ][value];
      $('chart-desc').textContent=desc; $('status').textContent=desc;
    }
    buttons.forEach((id,i)=>$(id).addEventListener('click',()=>setStage(i+1)));
    $('reset').addEventListener('click',()=>setStage(1,false));
    document.addEventListener('keydown',event=>{
      if(event.repeat||(event.target.tagName==='BUTTON'&&event.key===' ')) return;
      if(['ArrowRight','PageDown',' ','ArrowLeft','PageUp','Home'].includes(event.key)) {
        event.preventDefault();
        const next=event.key==='Home'?1:['ArrowLeft','PageUp'].includes(event.key)?Math.max(1,stage-1):Math.min(5,stage+1);
        if(next!==stage) setStage(next);
      }
    });
    function fit() { document.documentElement.style.setProperty('--scale',Math.min(innerWidth/1280,innerHeight/720)); }
    addEventListener('resize',fit); fit();
    const hash=new URLSearchParams(location.hash.slice(1));
    setStage(Math.max(1,Math.min(5,Math.floor(Number(hash.get('state'))||1))),false);
  </script>
</body>
</html>
