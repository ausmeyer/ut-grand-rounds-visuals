        element('circle',{cx:LX(s.dose_time),cy:BY(s.epidemic_at_dose)},$('epidemic-markers')),
        element('circle',{cx:LX(s.dose_time),cy:PY(s.protection_at_dose)},$('protection-markers')),
        element('circle',{cx:DX(s.dose_time),cy:DY(s.decision_points[s.best_index][1])},$('decision-markers'))
      ];
      markers.forEach(mark=>{
        for(const [key,value] of Object.entries({r:5,fill:'#933a4b',stroke:'#fbfaf6','stroke-width':1.2,'data-draw':s.draw,'data-week':s.best_week,'data-time':s.dose_time})) mark.setAttribute(key,value);
      });
      return {curves,markers};
    });
    const alignment=DATA.alignment;
    const AX=t=>64+(t-alignment.x_min)/(alignment.x_max-alignment.x_min)*796;
    const AY=v=>443-v/alignment.y_max*293;
    for(const fraction of [0,.5,1]) element('line',{x1:64,x2:860,y1:AY(fraction*alignment.y_max),y2:AY(fraction*alignment.y_max),class:'grid'},$('alignment-grid'));
    element('text',{x:64,y:137,class:'axis'},$('alignment-grid'),'Relative influenza activity');
    for(let t=Math.ceil(alignment.x_min/8)*8;t<=alignment.x_max;t+=8) element('text',{x:AX(t),y:469,'text-anchor':'middle',class:'axis'},$('alignment-axis'),t===0?'Peak':`${t>0?'+':''}${t}`);
    element('line',{x1:AX(0),x2:AX(0),y1:150,y2:443,stroke:'#a4b0b0','stroke-dasharray':'3 5'},$('alignment-grid'));
    element('rect',{x:AX(alignment.after.q1),y:150,width:AX(alignment.after.q3)-AX(alignment.after.q1),height:293,fill:'#933a4b',opacity:.08},$('alignment-band'));
    const alignmentGraphics=alignment.profiles.map(profile=>{
      const group=element('g',{'data-draw':profile.draw,'data-shift':profile.shift},$('aligned-profiles'));
      element('path',{d:path(profile.points,AX,AY),class:'sample',stroke:'#a4b0b0','stroke-width':1.1,opacity:.38},group);
      element('circle',{cx:AX(profile.optimal_time_before),cy:AY(profile.optimal_height),r:3.4,fill:'#933a4b',opacity:.65,stroke:'#fbfaf6','stroke-width':.8},group);
      return group;
    });
    element('path',{d:path(alignment.mean_points,AX,AY),class:'sample',stroke:'#0a6670','stroke-width':3.2},$('alignment-mean'));
    element('line',{x1:AX(alignment.median_point[0]),x2:AX(alignment.median_point[0]),y1:150,y2:443,stroke:'#933a4b','stroke-width':1.5,'stroke-dasharray':'5 5'},$('alignment-mean'));
    element('circle',{cx:AX(alignment.median_point[0]),cy:AY(alignment.median_point[1]),r:6.5,fill:'#933a4b',stroke:'#fbfaf6','stroke-width':2},$('alignment-mean'));
    element('text',{x:AX(alignment.median_point[0])-10,y:171,'text-anchor':'end','font-size':15,fill:'#933a4b'},$('alignment-mean'),'Median date');
    $('median-weeks').textContent=`~${Math.round(-alignment.after.median)} weeks`;
    $('summary-count').textContent=`FOR THESE ${DATA.scenarios.length} SCENARIOS`;
    const forecast=DATA.forecast_example;
    const FX=t=>64+(t+4)/4*936, FY=v=>436-v/forecast.y_max*286;
    for(const value of [0,2,4,6]) {
      element('line',{x1:64,x2:1000,y1:FY(value),y2:FY(value),class:'grid'},$('forecast-grid'));
      element('text',{x:53,y:FY(value)+5,'text-anchor':'end',class:'axis'},$('forecast-axis'),`${value}×`);
    }
    for(const week of [-4,-3,-2,-1,0]) element('text',{x:FX(week),y:464,'text-anchor':'middle',class:'axis'},$('forecast-axis'),week===0?'Aligned week':String(week));
    element('line',{x1:FX(-2),x2:FX(-2),y1:150,y2:436,stroke:'#a4b0b0','stroke-dasharray':'3 5'},$('forecast-grid'));
    element('path',{d:`M${FX(-2)} 144 V136 H${FX(0)} V144`,fill:'none',stroke:'#93a49f'},$('forecast-grid'));
    element('text',{x:FX(-1),y:126,'text-anchor':'middle',class:'axis'},$('forecast-grid'),'2-week-ahead forecast');
    element('text',{x:76,y:FY(4)-10,'font-size':14,style:'fill:var(--muted)'},$('forecast-grid'),'4× early-November level');
    forecast.seasons.forEach((season,i)=>{
      const color=['#0a6670','#526c98','#9a763a'][i];
      const band=[...season.forecast.map(p=>[p.week,p.lower]),...season.forecast.map(p=>[p.week,p.upper]).reverse()];
      element('path',{d:path(band,FX,FY)+' Z',fill:color,opacity:.09,'data-season':season.season},$('forecast-bands'));
      element('path',{d:path(season.observed_points,FX,FY),class:'sample',stroke:color,'stroke-width':3,'data-season':season.season},$('forecast-observed'));
      element('circle',{cx:FX(0),cy:FY(season.ratio),r:5.5,fill:'#933a4b',stroke:'#fbfaf6','stroke-width':1.5,'data-season':season.season,'data-date':season.target_date},$('forecast-observed'));
      element('text',{x:FX(0)+15,y:FY(season.ratio)+5,'font-size':16,'font-weight':600,style:`fill:${color}`},$('forecast-observed'),season.season);
      element('path',{d:path(season.forecast.map(p=>[p.week,p.median]),FX,FY),class:'sample',stroke:color,'stroke-width':2.5,'stroke-dasharray':'7 5','data-season':season.season},$('forecast-medians'));
      element('circle',{cx:FX(0),cy:FY(season.forecast.at(-1).median),r:4,fill:'#fbfaf6',stroke:color,'stroke-width':2,'data-season':season.season},$('forecast-medians'));
    });
    function revealForecast(progress) {
      for(const id of ['forecast-bands','forecast-medians']) $(id).style.opacity=progress;
      $('forecast-view').dataset.progress=progress;
    }
    function alignSeasons(progress) {
      alignmentGraphics.forEach((group,i)=>group.setAttribute('transform',`translate(${AX(progress*alignment.profiles[i].shift)-AX(0)} 0)`));
      $('alignment-view').dataset.progress=progress;
      for(const id of ['alignment-band','alignment-mean','alignment-summary']) $(id).style.display=progress===1?'':'none';
    }
    function samples(count,active=-1,showDates=true) {
      graphics.forEach((graphic,i)=>{
        const selected=i===active;
        graphic.curves.forEach((curve,panel)=>{
          curve.style.opacity='';
          curve.style.display=i<count&&(panel<2||showDates)?'':'none';
          curve.setAttribute('stroke',panel===0?(selected?'#647b7d':'#a4b0b0'):(selected?'#0a6670':'#7b9e9a'));
          curve.setAttribute('stroke-width',selected?2.6:1.1); curve.setAttribute('opacity',selected?1:[.35,.23,.35][panel]);
        });
        graphic.markers.forEach(mark=>{
          mark.style.display=i<count&&showDates?'':'none'; mark.style.opacity=selected?1:.5; mark.setAttribute('r',selected?5.5:3.4);
        });
      });
      $('season-label').textContent=active>=0?DATA.scenarios[active].season:'';
      $('sample-count').textContent=`${count} of ${DATA.n_draws.toLocaleString('en-US')} simulated scenarios shown`;
    }
    function animate(duration,tick,done=()=>{}) {
      const start=performance.now();
      function frame(now) {
        const p=Math.max(0,Math.min(1,(now-start)/duration)); tick(p);
        if(p<1) animation=requestAnimationFrame(frame); else done();
      }
      animation=requestAnimationFrame(frame);
    }
    function setStage(value,play=true) {
      const previous=stage;
      cancelAnimationFrame(animation); stage=Math.max(1,Math.min(5,Math.floor(value))); value=stage;
      document.body.dataset.state=value; history.replaceState(null,'',`#state=${value}`);
      buttons.forEach((id,i)=>$(id).setAttribute('aria-pressed',value===i+1));
      $('scenario-view').style.display=value>=4?'none':'';
      $('alignment-view').style.display=value===4?'':'none';
      $('forecast-view').style.display=value===5?'':'none';
      $('chart-title').textContent=value===5?'Archived FluSight ensemble forecasts during the influenza rise':value===4?'Optimal dates after aligning epidemic curves':'Each scenario has its own best vaccination date';
      if(value===1) samples(1,0,false);
      else if(value===2) {
        samples(1,0);
        if(play&&value>previous&&!reducedMotion) {
          const reveal=[graphics[0].curves[2],...graphics[0].markers]; reveal.forEach(el=>el.style.opacity=0);
          animate(600,p=>reveal.forEach(el=>el.style.opacity=p));
        }
      } else if(value===3) {
        if(play&&value>previous&&!reducedMotion) {
          samples(1,0);
          let shown=1;
          animate(8000,p=>{const count=Math.min(graphics.length,1+Math.floor(p*graphics.length)); if(count!==shown) { samples(count,count-1); shown=count; }},()=>{
            samples(graphics.length);
          });
        } else { samples(graphics.length); }
      } else if(value===4) {
        $('sample-count').textContent='';
        if(play&&value>previous&&!reducedMotion) {
          alignSeasons(0); animate(1800,p=>alignSeasons(p*p*(3-2*p)));
        } else alignSeasons(1);
      } else {
        $('sample-count').textContent='US hospitalizations · 2023–24, 2024–25, 2025–26';
        if(play&&value>previous&&!reducedMotion) {
          revealForecast(0); animate(1000,revealForecast);
        } else revealForecast(1);
      }
      const desc=[
        '',
        'One saved simulated epidemic and vaccine-protection pair. Advance to reveal its best vaccination date.',
        `The regret curve reaches its calculated minimum at week ${DATA.scenarios[0].best_week}. Red dots mark that same dose date on the epidemic and calendar-aligned protection curves. Protection begins after the saved immune-response delay.`,
        `${DATA.scenarios.length} saved scenarios appear in sequence, each with a calculated regret minimum and matching dose-date dots on its epidemic and protection curves. These scenario-specific optima motivate a future forecast study; they are not a validated forecast-informed decision rule.`,
        `The ${DATA.scenarios.length} epidemic curves are normalized to equal total area and shifted to maximize shared area with a representative epidemic profile. The optimal dates move with their curves and are not used to choose the shifts. The median date is about ${Math.round(-alignment.after.median)} weeks before the aligned mean peak. These are descriptive results for the ${DATA.scenarios.length} displayed scenarios, not a validated decision rule.`,
        'Three observed US influenza hospitalization curves are aligned at the first reported week above four times their early-November level, using a baseline frozen before each forecast. Solid lines show later revised observations. Dashed lines and shaded 90% prediction intervals are actual archived FluSight ensemble forecasts with reference dates two weeks before the aligned week. The three red points mark illustrative comparison weeks, not optimal vaccination dates. All three forecast medians underestimate the observed rise. No peak is used for scaling or alignment. This hospitalization example does not establish a timing rule for the outpatient ILI vaccine model.'
      ][value];
      $('chart-desc').textContent=desc; $('status').textContent=desc;
    }
    buttons.forEach((id,i)=>$(id).addEventListener('click',()=>setStage(i+1)));
    $('reset').addEventListener('click',()=>setStage(1,false));
    document.addEventListener('keydown',event=>{
      if(event.repeat||(event.target.tagName==='BUTTON'&&event.key===' ')) return;
      if(['ArrowRight','PageDown',' ','ArrowLeft','PageUp','Home'].includes(event.key)) {
        event.preventDefault();
        const next=event.key==='Home'?1:['ArrowLeft','PageUp'].includes(event.key)?Math.max(1,stage-1):Math.min(5,stage+1);
        if(next!==stage) setStage(next);
      }
    });
    function fit() { document.documentElement.style.setProperty('--scale',Math.min(innerWidth/1280,innerHeight/720)); }
    addEventListener('resize',fit); fit();
    const hash=new URLSearchParams(location.hash.slice(1));
    setStage(Math.max(1,Math.min(5,Math.floor(Number(hash.get('state'))||1))),false);
  </script>
</body>
</html>
