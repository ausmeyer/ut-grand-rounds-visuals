<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Slide 30 · When can forecasts improve the decision?</title>
  <style>
    :root { --paper:#fbfaf6; --ink:#14242b; --muted:#647278; --teal:#0a6670; }
    * { box-sizing:border-box; }
    html,body { width:100%; height:100%; margin:0; overflow:hidden; }
    body { background:var(--paper); color:var(--ink); font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; }
    .slide { position:absolute; width:1280px; height:720px; left:50%; top:50%; transform:translate(-50%,-50%) scale(var(--scale,1)); transform-origin:center; }
    h1 { position:absolute; left:50px; top:48px; width:1180px; margin:0; font-family:Montserrat,Inter,ui-sans-serif,system-ui,sans-serif; font-size:36px; line-height:1.22; font-weight:550; letter-spacing:-.8px; }
    .visual { position:absolute; left:20px; top:113px; width:1240px; height:587px; }
    svg { display:block; width:1208px; height:535px; margin:0 16px; overflow:visible; }
    svg text { fill:var(--ink); font-family:inherit; }
    .axis { fill:var(--muted); font-size:16px; }
    .grid { stroke:#dfe4df; stroke-width:1; }
    .link { fill:none; stroke:#93a49f; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
    .controls { height:49px; padding:11px 29px 0; display:flex; align-items:center; gap:10px; }
    button { border:1px solid #b9c3c0; border-radius:8px; background:white; color:var(--ink); height:34px; font:inherit; font-size:14px; font-weight:650; cursor:pointer; padding:0 17px; white-space:nowrap; }
    button:hover { border-color:var(--teal); }
    button[aria-pressed=true] { color:var(--teal); border-color:var(--teal); background:#edf6f4; }
    button:focus-visible { outline:3px solid #82bcc1; outline-offset:3px; }
    #reset { padding:0 10px; font-size:19px; margin-left:auto; }
    #control-hint { color:var(--muted); font-size:13px; margin-left:9px; }
    .sr-only { position:absolute; width:1px; height:1px; overflow:hidden; clip-path:inset(50%); }
  </style>
</head>
<body>
  <main class="slide" aria-label="Slide 30. When can forecasts improve the decision?">
    <h1>When can forecasts improve the decision?</h1>
    <section class="visual" aria-label="A proposed study connecting surveillance, forecasts, and vaccination decisions">
      <svg viewBox="0 0 1208 535" role="img" aria-labelledby="chart-title chart-desc">
        <title id="chart-title">A future study of forecast-informed vaccination timing</title>
        <desc id="chart-desc"></desc>
        <text x="76" y="26" font-size="16" font-weight="650" style="fill:var(--teal)">NEXT STUDY</text>
        <text x="1178" y="26" text-anchor="end" font-size="15" class="axis">Illustrative</text>
        <text x="76" y="88" font-size="24" font-weight="650">Surveillance</text>
        <text x="448" y="88" font-size="24" font-weight="650">Forecast</text>
        <text x="925" y="88" font-size="24" font-weight="650">Decision</text>
        <text x="76" y="118" class="axis">What is happening now?</text>
        <text x="448" y="118" class="axis">What could happen next?</text>
        <text x="925" y="118" class="axis">Candidate action to test</text>
        <line x1="80" x2="345" y1="374" y2="374" class="grid"/>
        <line x1="80" x2="80" y1="166" y2="374" class="grid"/>
        <line x1="448" x2="807" y1="374" y2="374" class="grid"/>
        <line x1="448" x2="448" y1="166" y2="374" class="grid"/>
        <text x="80" y="400" class="axis">Earlier</text>
        <text id="observed-now" x="295" y="400" text-anchor="middle" class="axis">Now</text>
        <text x="448" y="400" class="axis">Now</text>
        <text x="807" y="400" text-anchor="end" class="axis">Later this season</text>
        <text transform="translate(51 280) rotate(-90)" text-anchor="middle" class="axis">Influenza activity</text>
        <path d="M369 266 H418 M409 260 L418 266 L409 272 M838 266 H901 M892 260 L901 266 L892 272" class="link"/>
        <g id="data-view" style="display:none">
          <path id="observations" fill="none" stroke="#14242b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
          <g id="observed-points"></g>
          <path id="new-observation" fill="none" stroke="#0a6670" stroke-width="4" stroke-linecap="round"/>
          <circle id="new-point" r="6" fill="#0a6670"/>
          <path id="forecast-fan" fill="#c8e1dd"/>
          <path id="forecast-center" fill="none" stroke="#0a6670" stroke-width="3" stroke-linecap="round"/>
          <circle id="forecast-anchor" cx="448" r="4" fill="#0a6670"/>
        </g>
        <g id="action-now">
          <rect x="925" y="185" width="252" height="74" rx="10" fill="#fbfaf6" stroke="#c4ceca" stroke-width="2"/>
          <text x="1051" y="231" text-anchor="middle" font-size="23" font-weight="600">Vaccinate now</text>
        </g>
        <g id="action-later">
          <rect x="925" y="283" width="252" height="74" rx="10" fill="#fbfaf6" stroke="#c4ceca" stroke-width="2"/>
          <text x="1051" y="329" text-anchor="middle" font-size="23" font-weight="600">Keep planned date</text>
        </g>
        <path d="M1051 387 V367 M1045 376 L1051 367 L1057 376" class="link"/>
        <text x="1051" y="409" text-anchor="middle" font-size="17" class="axis">Chance of receiving</text>
        <text x="1051" y="431" text-anchor="middle" font-size="17" class="axis">a later dose</text>
        <g id="comparison" style="display:none">
          <line x1="76" x2="1178" y1="453" y2="453" class="grid"/>
          <text x="568" y="485" text-anchor="end" font-size="20">Fixed preseason rule</text>
          <text x="604" y="485" text-anchor="middle" font-size="17" class="axis">vs</text>
          <text x="640" y="485" font-size="20" style="fill:var(--teal)">Rule updated during the season</text>
          <text x="604" y="522" text-anchor="middle" font-size="23" font-weight="550">Do updated decisions improve clinical outcomes?</text>
        </g>
      </svg>
      <div class="controls">
        <button id="start" aria-pressed="true">1 · Start</button>
        <button id="plan" aria-pressed="false">2 · Initial plan</button>
        <button id="update" aria-pressed="false">3 · New surveillance</button>
        <button id="compare" aria-pressed="false">4 · Compare rules</button>
        <span id="control-hint">Arrow keys to advance</span>
        <button id="reset" aria-label="Reset demonstration" title="Reset">↺</button>
      </div>
      <output id="status" class="sr-only" aria-live="polite"></output>
    </section>
  </main>
  <script>
    const DATA = {"synthetic":true,"decision_rule_validated":false,"description":"Synthetic observations and plausible future trajectories for a conceptual future-study workflow. The fan is illustrative, not a calibrated prediction interval.","action_rule":"Illustrative candidate actions assigned for the presentation; not calculated by a fitted or validated decision rule.","later_dose_receipt_probability":null,"initial":{"observations":[0.09,0.11,0.12,0.1,0.15,0.17],"forecast":[[0.0,0.17,0.17,0.17],[0.5,0.1325418,0.1650722,0.1976025],[1.0,0.1060686,0.1642794,0.2224901],[1.5,0.0892912,0.1678474,0.2464036],[2.0,0.0814451,0.176192,0.2709388],[2.5,0.0821408,0.1898427,0.2975445],[3.0,0.091205,0.2093417,0.3274785],[3.5,0.1085082,0.2351174,0.3617265],[4.0,0.1337868,0.2673398,0.4008929],[4.5,0.1664687,0.3057753,0.445082],[5.0,0.2055273,0.3496604,0.4937935],[5.5,0.2493851,0.3976227,0.5458603],[6.0,0.2958933,0.4476731,0.5994529],[6.5,0.3424024,0.4972865,0.6521706],[7.0,0.3859288,0.5435762,0.7012236],[7.5,0.4234041,0.5835491,0.7436941],[8.0,0.4519758,0.6144116,0.7768474],[8.5,0.4693181,0.6338836,0.7984491],[9.0,0.4739003,0.6404701,0.8070398],[9.5,0.4651698,0.6336461,0.8021224],[10.0,0.443615,0.6139217,0.7842284],[10.5,0.4106982,0.582776,0.7548539],[11.0,0.3686685,0.5424714,0.7162742],[11.5,0.3202886,0.4957805,0.6712724],[12.0,0.2685184,0.4456713,0.6228243],[12.5,0.2162072,0.3949994,0.5737917],[13.0,0.1658362,0.3462507,0.5266653],[13.5,0.1193415,0.3013651,0.4833887],[14.0,0.0780296,0.2616519,0.4452743],[14.5,0.0425814,0.2277945,0.4130075],[15.0,0.0131262,0.1999237,0.3867213],[15.5,0,0.1777379,0.3661151],[16.0,0,0.1606399,0.3505929]],"candidate_action":"Keep planned date"},"updated":{"observations":[0.09,0.11,0.12,0.1,0.15,0.17,0.43],"forecast":[[0.0,0.43,0.43,0.43],[0.5,0.4422523,0.4747827,0.5073131],[1.0,0.4703941,0.5286048,0.5868155],[1.5,0.508516,0.5870722,0.6656284],[2.0,0.5503269,0.6450737,0.7398206],[2.5,0.58947,0.6971718,0.8048736],[3.0,0.6200184,0.7381552,0.856292],[3.5,0.6370503,0.7636594,0.8902686],[4.0,0.6371808,0.7707339,0.904287],[4.5,0.6189298,0.7582364,0.897543],[5.0,0.5828353,0.7269684,0.8711015],[5.5,0.5312809,0.6795185,0.8277561],[6.0,0.4680649,0.6198447,0.7716245],[6.5,0.3977984,0.5526825,0.7075666],[7.0,0.3252465,0.4828938,0.6405412],[7.5,0.2547336,0.4148786,0.5750236],[8.0,0.1897035,0.3521393,0.5145751],[8.5,0.1324832,0.2970487,0.4616142],[9.0,0.0842523,0.2508221,0.4173918],[9.5,0.0451783,0.2136545,0.3821308],[10.0,0.0146558,0.1849625,0.3552692],[10.5,0,0.1636643,0.3357421],[11.0,0,0.1484438,0.3222466],[11.5,0,0.1379618,0.3134538],[12.0,0,0.1309997,0.3081527],[12.5,0,0.1265364,0.3053287],[13.0,0,0.1237726,0.3041871],[13.5,0,0.1221182,0.3041418],[14.0,0,0.1211599,0.3047822],[14.5,0,0.120622,0.3058351],[15.0,0,0.1203288,0.3071264],[15.5,0,0.1201732,0.3085504],[16.0,0,0.1200923,0.3100454]],"candidate_action":"Vaccinate now"},"evaluation":"Compare a fixed preseason rule with a rule updated during the season; evaluate clinical outcomes and vaccination uptake."};
    const $ = id => document.getElementById(id);
    const NS = 'http://www.w3.org/2000/svg';
    const observedX = i => 80+i*43, forecastX = t => 448+t/16*359, Y = activity => 374-activity*208;
    const buttons = ['start','plan','update','compare'];
    const reducedMotion = matchMedia('(prefers-reduced-motion:reduce)').matches;
    let stage = 1, animation = 0;
    $('observations').setAttribute('d',DATA.initial.observations.map((value,i)=>`${i?'L':'M'}${observedX(i)},${Y(value)}`).join(' '));
    DATA.initial.observations.forEach((value,i)=>{
      const point=document.createElementNS(NS,'circle');
      point.setAttribute('cx',observedX(i)); point.setAttribute('cy',Y(value)); point.setAttribute('r',4); point.setAttribute('fill','#14242b');
      $('observed-points').appendChild(point);
    });
    function drawForecast(progress) {
      const rows=DATA.initial.forecast.map((row,i)=>row.map((value,j)=>value+(DATA.updated.forecast[i][j]-value)*progress));
      const path=(points,column)=>points.map((row,i)=>`${i?'L':'M'}${forecastX(row[0]).toFixed(2)},${Y(row[column]).toFixed(2)}`).join(' ');
      $('forecast-fan').setAttribute('d',path(rows,3)+' '+path([...rows].reverse(),1).replace(/^M/,'L')+' Z');
      $('forecast-center').setAttribute('d',path(rows,2));
      $('forecast-anchor').setAttribute('cy',Y(rows[0][2]));
      const last=DATA.initial.observations.at(-1), next=DATA.updated.observations.at(-1);
      const x=observedX(5)+43*progress, y=Y(last+(next-last)*progress);
      $('new-observation').setAttribute('d',`M${observedX(5)},${Y(last)} L${x},${y}`);
      $('new-point').setAttribute('cx',x); $('new-point').setAttribute('cy',y);
      $('observed-now').setAttribute('x',x);
      for(const [id,active] of [['action-now',stage>=2&&progress>=.5],['action-later',stage>=2&&progress<.5]]) {
        const group=$(id), rect=group.querySelector('rect'), label=group.querySelector('text');
        rect.setAttribute('fill',active?'#e9f3f0':'#fbfaf6'); rect.setAttribute('stroke',active?'#0a6670':'#c4ceca');
        label.style.fill=active?'#0a6670':'#647278';
      }
    }
    function setStage(value,play=true) {
      const previous=stage;
      cancelAnimationFrame(animation); stage=value; document.body.dataset.state=value;
      history.replaceState(null,'',`#state=${value}`);
      buttons.forEach((id,i)=>$(id).setAttribute('aria-pressed',value===i+1));
      $('data-view').style.display=value>1?'':'none'; $('data-view').style.opacity=1;
      $('new-observation').style.display=value>=3?'':'none'; $('new-point').style.display=value>=3?'':'none';
      $('comparison').style.display=value===4?'':'none'; $('comparison').style.opacity=1;
      drawForecast(value>=3?1:0);
      if(play&&value>previous&&value>1&&!reducedMotion) {
        const start=performance.now(), duration=value===3?1000:500;
        if(value===3) drawForecast(0);
        else $(value===2?'data-view':'comparison').style.opacity=0;
        function frame(now) {
          const progress=Math.max(0,Math.min(1,(now-start)/duration));
          if(value===3) drawForecast(progress*progress*(3-2*progress));
          else $(value===2?'data-view':'comparison').style.opacity=progress;
          if(progress<1) animation=requestAnimationFrame(frame);
        }
        animation=requestAnimationFrame(frame);
      }
      const descriptions=[
        'Proposed next study. All observations, forecast trajectories, and candidate actions on this slide are illustrative. No decision rule has been validated.',
        'An initial forecast of a later epidemic accompanies the candidate action to keep the planned vaccination date.',
        'New rising surveillance shifts the example forecast earlier and changes the illustrative candidate action to vaccinate now. The chance of receiving a later dose is also an input.',
        'Compare a fixed preseason rule with a rule updated during the season, and test whether updated decisions improve clinical outcomes.'
      ];
      $('chart-desc').textContent=descriptions.slice(0,value).join(' '); $('status').textContent=$('chart-desc').textContent;
    }
    buttons.forEach((id,i)=>$(id).addEventListener('click',()=>setStage(i+1)));
    $('reset').addEventListener('click',()=>setStage(1,false));
    document.addEventListener('keydown',event=>{
      if(event.repeat||(event.target.tagName==='BUTTON'&&event.key===' ')) return;
      if(['ArrowRight','PageDown',' ','ArrowLeft','PageUp','Home'].includes(event.key)) {
        event.preventDefault(); setStage(event.key==='Home'?1:['ArrowLeft','PageUp'].includes(event.key)?Math.max(1,stage-1):Math.min(4,stage+1));
      }
    });
    function fit() { document.documentElement.style.setProperty('--scale',Math.min(innerWidth/1280,innerHeight/720)); }
    addEventListener('resize',fit); fit();
    const hash=new URLSearchParams(location.hash.slice(1));
    setStage(Math.max(1,Math.min(4,Math.floor(Number(hash.get('state'))||1))),false);
  </script>
</body>
</html>
