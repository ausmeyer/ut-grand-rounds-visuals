<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <meta name="color-scheme" content="light">
  <title>Slide 32 · Where are we now?</title>
  <style>
    :root { --paper:#fbfaf6; --ink:#14242b; --muted:#647278; --teal:#0a6670; }
    * { box-sizing:border-box; }
    html,body { width:100%; height:100%; margin:0; overflow:hidden; }
    body { background:var(--paper); color:var(--ink); font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; }
    .slide { position:absolute; width:1280px; height:720px; left:50%; top:50%; transform:translate(-50%,-50%) scale(var(--scale,1)); transform-origin:center; }
    h1 { position:absolute; left:50px; top:48px; width:1180px; margin:0; font-family:Montserrat,Inter,ui-sans-serif,system-ui,sans-serif; font-size:36px; line-height:1.22; font-weight:550; letter-spacing:-.8px; }
    .visual { position:absolute; left:20px; top:113px; width:1240px; height:587px; }
    svg { display:block; width:1208px; height:535px; margin:0 16px; overflow:visible; }
    svg text { fill:var(--ink); font-family:inherit; }
    .axis { fill:var(--muted); font-size:14px; }
    .curve { fill:none; stroke-linejoin:round; stroke-linecap:round; }
    .grid { stroke:#dfe4df; stroke-width:1; }
    .controls { height:49px; padding:11px 29px 0; display:flex; align-items:center; gap:8px; }
    button { border:1px solid #b9c3c0; border-radius:8px; background:white; color:var(--ink); height:34px; font:inherit; font-size:14px; font-weight:650; cursor:pointer; padding:0 12px; white-space:nowrap; }
    button:hover { border-color:var(--teal); }
    button[aria-pressed=true] { color:var(--teal); border-color:var(--teal); background:#edf6f4; }
    button:focus-visible { outline:3px solid #82bcc1; outline-offset:3px; }
    #reset { padding:0 10px; font-size:19px; margin-left:auto; }
    #control-hint { color:var(--muted); font-size:13px; margin-left:8px; }
    .sr-only { position:absolute; width:1px; height:1px; overflow:hidden; clip-path:inset(50%); }
  </style>

<body>

      <div class="controls">

        <span id="control-hint">Arrow keys to advance</span>
        <button id="reset" aria-label="Reset demonstration" title="Reset">↺</button>
      </div>
      <output id="status" class="sr-only" aria-live="polite"></output>
    </section>

    const $=id=>document.getElementById(id), NS='http://www.w3.org/2000/svg';
    const reducedMotion=matchMedia('(prefers-reduced-motion:reduce)').matches;
    const buttons=['start','us-threshold','states','state-thresholds'];
    let stage=1, animation=0;
    function element(tag,attrs,parent,text) {
      const el=document.createElementNS(NS,tag);
      for(const [key,value] of Object.entries(attrs)) el.setAttribute(key,value);
      if(text!==undefined) el.textContent=text;
      parent.appendChild(el); return el;
    }
    function plot(parent,row,x,y,width,height,yMax,compact=false) {
      const group=element('g',{'data-location':row.name},parent);
      const X=week=>x+(week-DATA.first_week)/(DATA.latest_week-DATA.first_week)*width;
      const Y=value=>y+height-value/yMax*height;
      element('text',{x,y:y-22,'font-size':compact?22:24,'font-weight':600},group,row.label);
      for(const value of [0,yMax/2,yMax]) {
        element('line',{x1:x,x2:x+width,y1:Y(value),y2:Y(value),class:'grid'},group);
        element('text',{x:x-12,y:Y(value)+5,'text-anchor':'end',class:'axis'},group,Number(value.toFixed(2)));
      }
      DATA.ticks.forEach((tick,i)=>element('text',{x:X(tick.week),y:y+height+25,'text-anchor':i===0?'start':i===DATA.ticks.length-1?'end':'middle',class:'axis'},group,tick.label));
      let d='',connected=false;
      row.points.forEach(point=>{
        if(point.value===null) {connected=false;return;}
        d+=`${connected?'L':'M'}${X(point.week).toFixed(3)},${Y(point.value).toFixed(3)} `; connected=true;
      });
      element('path',{d,class:'curve',stroke:'#425f66','stroke-width':compact?2.7:3.2,'data-layer':'observed'},group);
      row.points.forEach(point=>{
        if(point.value===null) return;
        const dot=element('circle',{cx:X(point.week),cy:Y(point.value),r:point.week===DATA.latest_week?(compact?4:5):2.2,fill:'#425f66','data-week':point.week,'data-value':point.value,'data-date':point.week_ending},group);
        element('title',{},dot,`${row.label}, week ending ${point.week_ending}: ${point.value.toFixed(2)}% of visits for ILI`);
      });
      const rule=element('g',{'data-layer':'threshold','data-threshold':row.threshold_percentage},group);
      const line=element('line',{x1:x,x2:x+width,y1:Y(row.threshold_percentage),y2:Y(row.threshold_percentage),stroke:'#0a6670','stroke-width':2,'stroke-dasharray':'8 6'},rule);

    }

    function animate(duration,tick,done=()=>{}) {
      const start=performance.now();
      function frame(now) {
        const p=Math.max(0,Math.min(1,(now-start)/duration)); tick(p);
        if(p<1) animation=requestAnimationFrame(frame); else done();
      }

    function setStage(value,play=true) {
      const previous=stage;
      cancelAnimationFrame(animation); stage=Math.max(1,Math.min(buttons.length,Math.floor(value)));
      document.body.dataset.state=stage; history.replaceState(null,'',`#state=${stage}`);
      buttons.forEach((id,i)=>$(id).setAttribute('aria-pressed',stage===i+1));
      const stateView=stage>=3, showRule=stage===2||stage===4;
      $('national-view').style.display=stateView?'none':''; $('states-view').style.display=stateView?'':'none';

      });
      if(play&&previous<stage&&!reducedMotion) {
        if(stage===3) {

            const fade=p*p*(3-2*p);

          },()=>{$('national-view').style.display='none';});
        } else if(showRule) {
          const plots=stateView?states:[national];
          plots.forEach(plot=>{plot.line.setAttribute('x2',plot.x);plot.label.style.opacity=0;});

            plot.line.setAttribute('x2',plot.x+plot.width*p);
            plot.label.style.opacity=Math.max(0,(p-.5)*2);
          }));
        }
      }
      const locations=stateView?DATA.states:[DATA.national];
      const detail=locations.map(row=>`${row.label}: latest reported ILI ${row.latest_percentage.toFixed(2)} percent${showRule?`, candidate threshold ${row.threshold_percentage.toFixed(2)} percent, 2.3 times the arithmetic mean of reported percentages in weeks 32–35`:''}.`).join(' ');
      const desc=`${detail} CDC ILINet data through the week ending ${DATA.latest_week_ending}, downloaded ${DATA.retrieved_utc.slice(0,10)}. These are reported observations with no fitted epidemic curve or forecast. The national series is CDC population-weighted ILI; state series are published unweighted percentages. New York excludes New York City because its separate series is unavailable. Vertical scales differ across the state panels. The 2.3 multiplier is reused without recalibration from slides 30–31. Applying a rule calibrated on latent curves to observed values is an exploratory illustration, not a validated clinical timing rule or an official CDC threshold. It uses each location’s own baseline. Data are preliminary and can be revised. The page is a dated snapshot, not an automatically refreshing feed.`;

    buttons.forEach((id,i)=>$(id).addEventListener('click',()=>setStage(i+1)));
    $('reset').addEventListener('click',()=>setStage(1,false));
    document.addEventListener('keydown',event=>{
      if(event.repeat||(event.target.tagName==='BUTTON'&&event.key===' ')) return;
      if(['ArrowRight','PageDown',' ','ArrowLeft','PageUp','Home'].includes(event.key)) {
        event.preventDefault();
        const next=event.key==='Home'?1:['ArrowLeft','PageUp'].includes(event.key)?Math.max(1,stage-1):Math.min(buttons.length,stage+1);
        if(next!==stage) setStage(next);
      }
    });
    function fit() { document.documentElement.style.setProperty('--scale',Math.min(innerWidth/1280,innerHeight/720)); }
    addEventListener('resize',fit); fit();
    const hash=new URLSearchParams(location.hash.slice(1));
    setStage(Math.max(1,Math.min(buttons.length,Math.floor(Number(hash.get('state'))||1))),false);
