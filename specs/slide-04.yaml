  - ../docs/assets/slide-04-hospital.webp
  - ../docs/assets/slide-04-lab.webp
  - ../docs/assets/slide-04-mortality.webp
editorial_point: No single stream measures influenza directly; complementary systems observe different parts of the illness and healthcare journey.
sources:
  - https://www.cdc.gov/fluview/overview/index.html
