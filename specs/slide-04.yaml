slide: 4
title: There are many different influenza surveillance systems in the US
route: slide-04.html
format:
  responsive: false
  target_width_px: 1240
  target_height_px: 540
  minimum_height_px: 540
  behavior: use fixed coordinates and assume an exact 1240-by-540 iframe
visual:
  type: interactive patient-journey surveillance diagram
  stages:
    - symptomatic illness
    - outpatient clinic
    - emergency department
    - inpatient hospitalization
    - mortality
    - virologic testing
  controls:
    - surveillance layer dropdown
    - clickable surveillance-system labels
  behavior:
    - arrange the six illustrations independently with generous whitespace
    - use only horizontal and vertical connector segments
    - keep every surveillance-system label outside the illustration artwork
    - arrange ICLS and NREVSS as a vertical label column to the right of virologic testing
    - selecting a system pins its full name and reported signal in the sidebar
    - selecting a surveillance layer emphasizes only systems in that layer
    - selected system and layer are stored in the URL fragment
systems_source: ../data/slide-04-systems.json
illustrations:
