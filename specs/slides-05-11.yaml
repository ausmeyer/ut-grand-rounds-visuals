data:
  source_directory: ../../data/processed
  files:
    - ilinet_national_seasons.csv
    - ilinet_state_seasons.csv
    - nssp_national_seasons.csv
    - nssp_state_seasons.csv
    - nhsn_national_seasons.csv
    - nhsn_state_seasons.csv
    - flusurv_state_seasons.csv
    - nrevss_national_seasons.csv
    - nrevss_state_seasons.csv
  overlay_transformation: min-max scale each surveillance system-season across all included locations to [0, 1]
  overlay_time_alignment: preserve the original MMWR seasonal week; do not shift curves
  overlay_summary: week-specific median across scaled national or network aggregate seasons for each system
editorial_points:
  - Each system observes a different encounter, specimen stream, population, and denominator.
  - Geographic coverage must be described in system-specific units rather than as one comparable location count.
  - Network history and the currently comparable public extract are not always the same period.
  - NSSP remains syndromic surveillance infrastructure, while the public influenza measure shown is defined from discharge diagnoses and clinical terms.
  - Similar seasonal timing does not make the surveillance measures interchangeable.
